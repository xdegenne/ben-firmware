# BEN Device — Update Matrix (machine-readable)
#
# SEUL fichier consommé par l'agent OTA (src/pi/updater : find_next_transition).
# Fichier volontairement MINIMAL : aucune release note ici (elles vivent dans ../CHANGELOG.md).
#
# updates_caps — flux d'update UNIQUE keyé sur softwareVersion (from → to), « mono-flux » :
#   plus de clé par modèle. Chaque transition = un tag Git signé GPG + un update.sh
#   CAPABILITY-AWARE (gate has_cap / cap_hw : un device hors-capability no-op et bump quand
#   même sa version). L'agent part de la version courante et enchaîne les `from == courant`.
#
# Release notes (humain, toutes versions Pi + Arduino) : ../CHANGELOG.md
# Ancienne matrice pré-ménage (history par-modèle + fallback `updates:`) : git show pi-0.9.1:compatibility.yaml

updates_caps:
  - from: "0.6.1"
    to:   "0.7.0"
    tag:  "pi-0.7.0"
    script: "updates/0.6.1_to_0.7.0/update.sh"   # durcissement watchdog LoRa (capability-aware : has_cap lora ; wired skip)
  - from: "0.7.0"
    to:   "0.8.0"
    tag:  "pi-0.8.0"
    script: "updates/0.7.0_to_0.8.0/update.sh"   # relabel model → commercial (Filaire/Radio) — TOUS les devices
  - from: "0.8.0"
    to:   "0.8.1"
    tag:  "pi-0.8.1"
    script: "updates/0.8.0_to_0.8.1/update.sh"   # fix agent OTA : clobber device.json (self-heal relabel + re-read avant bump)
  - from: "0.8.1"
    to:   "0.8.2"
    tag:  "pi-0.8.2"
    script: "updates/0.8.1_to_0.8.2/update.sh"   # fixes unboxing BLE (provisioner) : DEVICE_INFO compact (device.json>MTU iOS tronqué → app iOS KO), scan WiFi unique (rescan 30s affamait le lien BLE → décrochage Android), agent pairing Just Works (BlueZ 5.x/Service Changed). No-op pour un device en service (provisioner off) ; effet au prochain provisioning.
  - from: "0.8.2"
    to:   "0.8.3"
    tag:  "pi-0.8.3"
    script: "updates/0.8.2_to_0.8.3/update.sh"   # RETRAIT de l'agent de pairing (leurre) : il faisait bonder iOS → re-découverte post-bond → gel couleurs/verify au 1er unboxing + « Peer removed » au re-provisioning. Le vrai fix iOS = la MTU (0.8.2). No-op ; effet au prochain provisioning.
  - from: "0.8.3"
    to:   "0.8.4"
    tag:  "pi-0.8.4"
    script: "updates/0.8.3_to_0.8.4/update.sh"   # 2 fixes terrain : (1) lora-receiver — watchdog de SILENCE (RX vivant mais sourd : IRQ RX morte, SPI lisible → self-test aveugle), restart à backoff exponentiel 5min→×2→plafond 1h, persisté, reset à la 1re trame (incident ben-0010 17/07, 55 min de silence sans relance) ; (2) provisioner — garde anti-doublon on_connect (bluezero l'appelle 2× Connected+ServicesResolved sur tél lent → écrasait la reco couleurs → échec unboxing MIUI). Restart ben-lora-receiver sur les devices lora ; provisioner : effet au prochain unboxing.
  - from: "0.8.4"
    to:   "0.8.5"
    tag:  "pi-0.8.5"
    script: "updates/0.8.4_to_0.8.5/update.sh"   # échelle de jauge RÉSOLUE CÔTÉ BOÎTIER : /live ne renvoyait le plafond OBSERVÉ (high-water mark) qu'inconditionnellement → juste après l'unboxing ce max ≈ conso courante → conso faible affichée ROUGE dans l'app. Fix local_api.py : plafond observé UNIQUEMENT si le foyer est CONNU (même gate que le niveau, levels.is_known : ≥200 pts, ≥2j, dynamique), sinon l'ABONNEMENT (PREF/ISOUSC, sinon 9000). L'app affiche le plafond tel quel (n'arbitre plus). Redémarre ben-local-api sur tous les modèles.
  - from: "0.8.5"
    to:   "0.8.6"
    tag:  "pi-0.8.6"
    script: "updates/0.8.5_to_0.8.6/update.sh"   # FIX récepteur : l'IINST (2e courbe histo) était ENVOYÉE par l'émetteur ET décodée par frame_codec, mais on_recv_curve ne la rangeait pas en base (boucle sur PAPP seulement) → colonne iinst NULL en histo/LoRa. On ajoute labels["IINST"]=iinst[i] dans la boucle de stockage. Redémarre ben-lora-receiver sur les devices lora. Sans effet en standard (pas de 2e courbe IINST).
  - from: "0.8.6"
    to:   "0.8.7"
    tag:  "pi-0.8.7"
    script: "updates/0.8.6_to_0.8.7/update.sh"   # « Au revoir » au désappairage : /unprovision fait 3 flashs VIOLETS sur la LED RGB juste avant le poweroff (signal clair de départ). local_api._unprovision stoppe désormais les readers TOUJOURS (libère les pins LED + ferme la base) puis flash. Redémarre ben-local-api (tous modèles). Effet au prochain /unprovision.
  - from: "0.8.7"
    to:   "0.9.1"
    tag:  "pi-0.9.1"
    script: "updates/0.8.7_to_0.9.1/update.sh"   # FACADE RADIO + FIX paho. La 0.9.0 (facade) oubliait python3-paho-mqtt (lib cliente MQTT) -> ben-radio crashe a l import -> crash-loop -> boucle reboot (incident ben-0011/ben-0003). Tag 0.9.0 immuable -> on corrige en 0.9.1 = MEME facade AVEC paho + garde-fou (abort AVANT cutover si paho absent -> monolithe preserve, pas de boucle). On REDIRIGE 0.8.7 direct vers 0.9.1 (plus par la 0.9.0 cassee). Decoupe monolithe -> ben-radio + ben-telemetry via bus MQTT local, canal commande volet chiffre, derivation cle par-device, adresse LoRa EEPROM, topic LED ben/led. GATED lora-tic-receiver.
  - from: "0.9.0"
    to:   "0.9.1"
    tag:  "pi-0.9.1"
    script: "updates/0.8.7_to_0.9.1/update.sh"   # RATTRAPAGE des devices qui ont REUSSI 0.9.0 (avaient paho) : meme script idempotent -> installe paho si besoin, re-restart facade, RE-ARME l escalade (le meme nom de drop-in ota-cutover-no-reboot.conf est nettoye au §7).
  - from: "0.9.1"
    to:   "0.9.2"
    tag:  "pi-0.9.2"
    script: "updates/0.9.1_to_0.9.2/update.sh"   # ACK applicatif crypto-vérifié des trames boot (anti cross-talk multi-logement) — cf. CHANGELOG 0.9.2. Pur code ben_radio.py. GATED lora-tic-receiver.
  - from: "0.9.2"
    to:   "0.9.3"
    tag:  "pi-0.9.3"
    script: "updates/0.9.2_to_0.9.3/update.sh"   # PAPP + IINST dans la trame de boot (conso dès le 1er boot → unboxing rapide ; histo : 230×IINST = production quand PAPP=0) + fix blink blanc BLOQUANT (retardait l'ACK applicatif → boucle de boots). Pur code frame_codec + ben_telemetry + ben_radio. GATED lora-tic-receiver.
  - from: "0.9.3"
    to:   "0.9.4"
    tag:  "pi-0.9.4"
    script: "updates/0.9.3_to_0.9.4/update.sh"   # coloration HC/HP en HISTO Tempo/BBR : HISTO_LABELS s'arrêtait à l'index 4 → registres BBR (index 5-10) sans libellé → _band_kind=base → app ne coloriait ni la courbe ni le badge, /live.tariff_label=null (révélé par ben-0010, 1er device Tempo). Complète les 6 registres BBR. Pur code store/db.py. UNIVERSEL (LoRa + filaire, pas de gate) : restart ben-local-api.
  # pi-0.9.5 a été taguée mais n'a JAMAIS été déployable : son `update.sh.sha256`
  # manquait → l'agent refusait d'exécuter le script (verify_sha256) après avoir
  # pourtant validé la signature GPG et fait le checkout. Aucun device n'a bumpé sa
  # version. Un tag publié ne se réécrit pas → 0.9.5 est BRÛLÉE, contenu identique
  # republié en 0.9.6 avec sa somme de contrôle. Cf. CHANGELOG (0.9.6).
  - from: "0.9.4"
    to:   "0.9.6"
    tag:  "pi-0.9.6"
    script: "updates/0.9.4_to_0.9.6/update.sh"   # (1) pdl_index = un COMPTEUR (ADCO) et non plus l'émetteur : tables pdl/emitter entretenues à la trame de boot ; migration additive, sources.json = graine (1er PDL = 0) ET repli (après OTA le Pi redémarre, pas l'Arduino). (2) Événements : table event, /events, X-Ben-Last-Event sur /live ; bascule d'offre (OPTARIF/NGTF) et de mode TIC. (3) PERFORMANCES : toute requête non filtrée sur pdl_index balayait les 3,1 M lignes — /live 28,6→0,10 s, /pdls 36,7→0,06 s, profileur de niveaux 199,9→0,55 s (P15 sur curve_rollup), charge 1,96→0,16. Pur code (db.py, local_api.py, levels.py, ben_telemetry.py, main_uart.py). UNIVERSEL (LoRa + filaire, pas de gate) : restart lecteur PUIS ben-local-api.
  - from: "0.9.6"
    to:   "0.9.7"
    tag:  "pi-0.9.7"
    script: "updates/0.9.6_to_0.9.7/update.sh"   # (1) COULEUR TEMPO en champ explicite sur /live et /registers (bleu/blanc/rouge) : résolue par le boîtier, déterministe en histo (index_id 5-6/7-8/9-10) et lue une fois par registre dans LTARF en standard — l'app n'a plus à chercher un mot français ni à connaître les 2 conventions. AUCUNE colonne ajoutée : la couleur est une interprétation d'index_id, que le rollup ventile déjà. (2) Les événements n'émettent plus d'ACTION : une route est une notion de l'app, et l'action figée à la naissance casserait au moindre remaniement de navigation. Pur code (db.py, local_api.py). UNIVERSEL (LoRa + filaire, pas de gate) : restart ben-local-api seul, les lecteurs ne sont pas concernés.
  - from: "0.9.7"
    to:   "0.9.8"
    tag:  "pi-0.9.8"
    script: "updates/0.9.7_to_0.9.8/update.sh"   # BANDES HC/HP EN STANDARD : `_band_kind()` ne reconnaissait que les libellés HISTORIQUES (« creus »/« plein ») ; en standard LTARF est abrégé (« HP  BLEU ») → tout retombait sur `base` → courbe entièrement GRISE et pas de badge HC/HP. Touchait TOUT contrat HC/HP en standard, pas seulement Tempo. Rétroactif sans backfill (les bandes sont recalculées à la lecture depuis le rollup). Pur code store/db.py. UNIVERSEL : restart ben-local-api seul.
  - from: "0.9.8"
    to:   "0.9.9"
    tag:  "pi-0.9.9"
    script: "updates/0.9.8_to_0.9.9/update.sh"   # (1) /registers BORNÉ AU CONTRAT EN COURS : registers() agrégeait tout le rollup sans borne → un registre d'une offre révolue restait affiché à vie (ben-0001 : le registre BASE de l'ère historique, muet depuis 7 semaines, à côté des registres Tempo). En standard index_id = POSITION dans le calendrier du contrat → le même numéro désigne un registre PHYSIQUE différent d'une offre à l'autre. Borné au début de l'époque (contract_epoch, posée en 0.9.8) ; ts_start=0 (jamais de changement d'offre, cas ben-0010) → filtre NEUTRE, aucune régression. La valeur reste BRUTE, celle de la facture : le Linky ne remet pas ses registres EASF à zéro en changeant d'offre. (2) TRAME TIC TRONQUÉE → CONTRAT REFUSÉ : un boot sans ISOUSC ni PREF vient d'un émetteur qui n'a pas lu la TIC (`CONTRAT='00'` sur ben-0001 à chaque ré-enregistrement, 7 s avant la vraie valeur) ; sans garde, chaque redémarrage ouvrirait une époque bidon, émettrait DEUX changement_offre et viderait /registers. La correction ÉMETTEUR (tic-reader 0.1.7, v.complete) n'est PAS ici — pas d'OTA sur AVR, elle attend un reflash. AUCUNE migration (contract_epoch existe depuis 0.9.8). UNIVERSEL : restart lecteur PUIS ben-local-api.
  - from: "0.9.9"
    to:   "0.9.10"
    tag:  "pi-0.9.10"
    script: "updates/0.9.9_to_0.9.10/update.sh"   # (1) STGE LU ET INTERPRÉTÉ : le TLV 0x23 (registre de statuts standard, 32 bits bruts) porte la couleur Tempo du JOUR (bits 24-25) et surtout du LENDEMAIN (bits 26-27) — seule source connue, NJOURF+1 désigne le calendrier FOURNISSEUR qu'EDF ne programme pas pour Tempo et vaut 0 en permanence. Offset tranché sur trame réelle du 14/08 (deux sources publiques se contredisaient d'un bit) : la convention 24-25 rend « bleu », conforme au terrain, et TOUS les autres champs du registre tombent juste avec elle. NI STOCKÉ NI EXPOSÉ — journalisé par log_uncabled, on observe d'abord. LoRa exige l'émetteur ≥ 0.1.8 (reflash manuel, pas d'OTA sur AVR) ; le FILAIRE est servi par cet OTA seul (main_uart.py lit la TIC en direct). (2) ANTI-ROLLBACK D'INDEX PAR REGISTRE : active_name vaut None pour TOUS les registres standard, et servait de clé → un seul casier pour les 10 registres Tempo ; le registre 2 né à 4 000 Wh passait pour un rollback de 15 M face aux 15 415 362 du registre 1, une alerte toutes les 40 s, et la mise à jour d'état vivant dans le `else` VERROUILLAIT l'alerte. Aggravé par `None` sérialisé en la CHAÎNE "null" que .get(None) ne retrouve plus → garde-fou amnésique à chaque redémarrage, donc muet et rassurant. Clé texte `s<index_id>` en standard / nom canonique en histo (évite en prime la collision entre l'ère histo et l'ère standard d'un MÊME boîtier), mise à jour INCONDITIONNELLE, purge des clés "null" héritées. (3) ISSUE DES COMMANDES DESCENDANTES PUBLIÉE sur ben/lora/tx/ack {ack, rtt_ms, id} : send_acked() connaît le sort d'un ordre à ~130 ms près mais ne le disait qu'au journal → une cible devenue SOURDE était indiscernable d'une cible qui marche. Additif, sans consommateur requis, `id` recopié tel quel donc façade toujours stateless. AUCUNE migration, aucune table, aucune colonne. UNIVERSEL (pas de gate) : restart ben-radio + ben-telemetry + ben-tic-reader, ben-local-api NON concerné.
  - from: "0.9.10"
    to:   "0.9.11"
    tag:  "pi-0.9.11"
    script: "updates/0.9.10_to_0.9.11/update.sh"   # UN BOÎTIER QUI REDÉMARRE AVANT SA BOX NE RESTE PLUS BLOQUÉ EN BLE. check_network est un ONESHOT : il tranchait une fois au boot puis rendait la main. Device déjà provisionné + réseau KO (coupure de courant : le boîtier reboote plus vite que la box) → provisioning BLE, et PERSONNE ne revenait tester le réseau — les readers n'ont pas de WantedBy, ils ne démarrent QUE par _start_readers(). Violet-jaune et zéro mesure jusqu'à un débranchement manuel. AUCUN filet ne rattrapait ça : wifi-watchdog n'est INSTALLÉ NULLE PART (ni install.sh ni aucun update.sh ne posent le script ou n'activent le timer — vérifié sur ben-0001 : absent/disabled), donc la seule reprise est l'autoconnect NM qui renonce après ses autoconnect-retries. Nouvel agent ben-network-recovery (démarré par check_network dans la SEULE branche provisionné+offline) : fenêtre BLE 5 min avec VEILLE PASSIVE (ping/30 s, court-circuite dès que NM se reconnecte seul — cas nominal, on ne coupe rien ; un PING et non un rescan, la radio WiFi+BLE étant PARTAGÉE sur Pi Zero W — même raison que le rescan supprimé en 0.8.2), puis arrêt du BLE, relance nmcli best-effort et COLLECTE. Une session BLE en cours n'est JAMAIS coupée (drapeau provisioning_state dans /run, posé on_connect, expirant à 15 min, effacé à chaque démarrage du provisioner). APRÈS 5 min DE FENÊTRE BLE LA COLLECTE DÉMARRE QUAND MÊME (déroulé LINÉAIRE, sans boucle : puisqu'on collecte de toute façon, une retentative WiFi ne déciderait plus de rien) : un boîtier hors ligne n'a pas besoin du réseau pour travailler (base SQLite LOCALE, app sur l'API locale), et un boîtier qui perd le réseau EN MARCHE continue de collecter — rien ne l'arrête. Refuser après un REDÉMARRAGE était une INCOHÉRENCE : même panne, deux comportements opposés selon qu'elle tombe avant ou après le boot. Horodatage hors ligne DÉCALÉ mais pas corrompu : pas de RTC sur Pi Zero, mais systemd ne restaure la dernière heure connue que vers l'AVANT ('System time advanced to'), donc jamais d'écriture dans le passé de la base ; l'erreur vaut la coupure et le NTP la rattrape d'un saut. En STANDARD elle est évitable (meter_ts déjà présent sur 100 % des points, 3802/3802 sur ben-0001, écart max 8 s) — chantier à part. Le BLE n'est pas sacrifié : CHAQUE boot sans réseau rejoue cette fenêtre, donc un débranchement rouvre 5 min de re-provisionnement. Une session BLE en cours RETIENT la bascule (drapeau expirant à 15 min pour qu'une session oubliée ne retienne pas la collecte). Le PREMIER unboxing n'est pas concerné : sans connexion ben-provisioned, check_network part en BLE direct — y rester est son mode NOMINAL (garanti par le banc test_network_recovery.py, joué par l'update). AU PASSAGE : Conflicts du provisioner complété avec ben-radio + ben-telemetry — il ne listait que le monolithe ben-lora-receiver, découpé en 0.9.1, donc l'exclusion mutuelle était FAUSSE sur tout le parc LoRa moderne. AUCUNE migration. UNIVERSEL (pas de gate). EFFET DIFFÉRÉ VOULU : l'OTA n'atteint qu'un boîtier en ligne, donc en mode normal — on installe les units + daemon-reload, rien n'est redémarré, le correctif prend effet au prochain boot sans réseau.
  - from: "0.9.11"
    to:   "0.9.13"
    tag:  "pi-0.9.13"
    script: "updates/0.9.11_to_0.9.13/update.sh"   # ⚠️ REPUBLIE pi-0.9.12, BRÛLÉE LE 10/09 : le contrôle d'effet final interrogeait `/info`, route INEXISTANTE de l'API locale (404) — API saine, service active(running), tout le reste appliqué, et le script échouait quand même → device.json non bumpé et update rejouée à chaque tick, donc façade radio redémarrée toutes les 10 min. Contrôle refait sur `/health` (exerce _device_info ET une lecture de base ; `db:false` est traité comme un échec, un simple 200 le masquerait). Aucune transition 0.9.12 → : cette version n'a jamais été inscrite sur aucun boîtier. CONTENU IDENTIQUE À LA 0.9.12 POUR LE RESTE : (1) LE VERROU TAINT NE TUE PLUS LA FAÇADE RADIO : radio_alive() commençait par kernel_died(), un drapeau PERMANENT (un taint ne se nettoie que par un reboot) consulté par un test PÉRIODIQUE dont la seule action est un RESTART DE SERVICE — boucle sans issue PAR CONSTRUCTION. ben-0001 le 05/09 : oops à 14:35 dans un script tiers, sans rapport avec la radio → 208 redémarrages en 6 h, 46 % des mesures perdues, PENDANT que la radio acquittait à 130 ms. Le filet StartLimitAction=reboot est passé à 3 s près (cycle 103 s vs fenêtre 300 s / 3 démarrages). La radio est jugée sur son self-test SPI et rien d'autre ; le taint reste un INDICE, signalé UNE fois. (2) MONOLITHE ben-lora-receiver SUPPRIMÉ (découpé en 0.9.1, figé à 0.9.4, exécuté par aucun boîtier depuis le cutover 0.9.0) : 35 Ko de logique dupliquée + une unit que install.sh copiait sur CHAQUE device neuf. Les références mortes PRODUISAIENT des défauts : (a) local_api._unprovision arrêtait « ben-tic-reader ben-lora-receiver » donc N'ARRÊTAIT RIEN sur un boîtier LoRa — LED tenue pendant le flash d'au revoir et surtout ?wipe=1 effaçant une base que ben-telemetry gardait OUVERTE EN WAL, recréée dans la seconde (wipe illusoire, même défaut que le script de preshipping corrigé le 15/08) → liste dérivée des CAPABILITIES, repli sur l'UNION de tous les services connus (au désappairage, en arrêter trop ne coûte rien, trop peu casse le wipe) ; (b) check_network.READERS_BY_MODEL, repli « device pas encore migré », mort ET nuisible — mort car tout boîtier en 0.9.x a franchi la migration 0.6.1→0.7.0 qui écrit les capabilities, nuisible car device.json.model porte le LABEL COMMERCIAL depuis la 0.8.0, donc la table ne matchait plus rien et la branche « modèle inconnu » démarrait le MONOLITHE au lieu de la façade radio → SUPPRIMÉ, les capabilities sont la norme, sans elles rien à démarrer et on le dit en ERROR ; (c) Before= de ben-led-release nommait le monolithe, donc les pins LED pouvaient n'être libérées qu'après le démarrage des lecteurs. Le RÉPERTOIRE src/pi/lora-receiver/ RESTE (frame_codec, curve_codec, secure_link importés en prod par les deux services — le supprimer casserait la façade sur tout le parc) ; README ajouté sur place, renommage = chantier à part. L'update PURGE l'unit du boîtier (install.sh l'avait copiée dans /etc/systemd/system) et contrôle que systemd ne la connaît plus. Banc étendu : un device.json sans capabilities ne doit RIEN lancer. AUCUNE migration, aucune table, aucune colonne. UNIVERSEL (pas de gate) : restart des services des capabilities déclarées, PUIS ben-local-api (l'API ouvre la base en lecture seule) — avec contrôle que /info répond encore, local_api gagnant un import capabilities.
  - from: "0.9.13"
    to:   "0.9.14"
    tag:  "pi-0.9.14"
    script: "updates/0.9.13_to_0.9.14/update.sh"   # RÉTENTION DES MESURES : 90 → 180 JOURS. Le parc atteignait 3 mois alors que RETENTION_DAYS valait 90 : le plus ancien jour d'historique s'effaçait CHAQUE JOUR, et il n'existait NULLE PART ailleurs (aucune sauvegarde des bases embarquées). Mesuré sur ben-0001 le 18/09 : 5 441 400 lignes couvrant EXACTEMENT 90 jours (20/06 → 18/09) — la purge mordait bel et bien. L'ingestion cloud étant en construction, la bâtir avant que le passé ne disparaisse était une course perdue d'avance : chaque semaine de chantier coûtait une semaine d'historique. 180 jours SUPPRIMENT l'échéance au lieu de courir après, pour le prix d'une constante. Coût : ~420 Mo de base en plus (420 → ~840 Mo) pour 9,5 Go libres sur la carte de ben-0001 — l'espace n'est pas la contrainte, la pression mémoire sur les 512 Mo du Pi Zero et la taille du WAL le sont, d'où 180 et non 365. 🚨 LE REDÉMARRAGE DES LECTEURS EST OBLIGATOIRE ET C'EST LE PIÈGE : `def prune(conn, retention_days=RETENTION_DAYS)` évalue son argument par défaut À L'IMPORT du module, une seule fois — un lecteur déjà lancé garde 90 indéfiniment. Changer le fichier sans redémarrer ne ferait STRICTEMENT RIEN, et l'update passerait pour réussie ; on ne s'en apercevrait que trois mois plus tard. Préflight en DEUX temps : grep sur la constante, puis IMPORT RÉEL du module pour vérifier la valeur effective (une redéfinition plus bas dans le fichier passerait le grep et pas l'import). Garde-fou espace disque avant d'agir : on refuse de doubler la rétention si la carte ne peut pas accueillir une base doublée + 512 Mo de marge WAL — échanger une perte d'historique contre une carte pleine serait nettement pire. Contrôle d'effet : tous les services des capabilités déclarées encore actifs après restart, et /health de l'API locale répondant avec db:true (elle ouvre la base en LECTURE SEULE, donc c'est la preuve que la base a survécu). ⚠️ Ce que le contrôle NE PEUT PAS prouver dans sa fenêtre : que la purge garde effectivement 180 jours — elle ne tourne qu'environ une fois par heure. Le script imprime donc la ligne exacte à surveiller ensuite (journalctl | grep 'store purge' → doit dire « >180j »). AUCUNE migration, aucune table, aucune colonne. UNIVERSEL (LoRa et filaire, pas de gate). 🎁 Le mouvement s'inversera : une fois le cloud alimenté, cette valeur pourra DESCENDRE à 7-30 jours et le boîtier deviendra plus rapide — les 90 jours ne servaient qu'à être la seule copie existante.
  - from: "0.9.14"
    to:   "0.9.15"
    tag:  "pi-0.9.15"
    script: "updates/0.9.14_to_0.9.15/update.sh"   # LE BOÎTIER POUSSE SES MESURES VERS LE CLOUD. Livre trois choses indissociables : (1) `src/pi/publisher/ben_publisher.py`, le sender — il lit l'outbox `measurements.sent`, présente dans le schéma DEPUIS LE JOUR 1 et jamais écrite jusqu'ici, envoie par lots de 500 en mTLS toutes les 60 s, et ne marque `sent=1` QU'APRÈS un 2xx ; un seul curseur qui avance du plus ANCIEN vers le plus récent (le curseur à deux bouts a été conçu puis jeté : l'OTA 0.9.14 portant la rétention à 180 j a supprimé la contrainte qui le justifiait). Stdlib `http.client`, pas `requests` — absent de requirements.txt. Gigue TOTALE sur échec : `random.uniform(0, min(2**n, 300))` et NON `min(2**n, 300)`, sinon deux boîtiers tombés ensemble reviendraient frapper ensemble ; vérifié en conditions réelles le 21/09 (délais tirés : 0, 2, 1, 12, 9, 40, 40, 93, 202 s). `pending_approx()` encadre par les rowid au lieu de compter : `SELECT count(*) WHERE sent=0` prend 37 SECONDES sur 5,4 M lignes de Pi Zero, et il était appelé à chaque lot. (2) `ben-publisher.service` — l'unité N'ÉTAIT INSTALLÉE NULLE PART : ni install.sh ni aucune update ne la posaient, si bien que l'étape 10 de check_update.py (« redémarrer le publisher après chaque update ») ne faisait RIEN depuis son ajout. Pas de WatchdogSec ni StartLimitAction=reboot : un publisher qui tombe ne doit JAMAIS rebooter le Pi — les mesures continuent de s'accumuler dans l'outbox, c'est exactement à ça qu'elle sert (leçon du verrou taint, 0.9.12 : un garde-fou plus destructeur que la panne qu'il traite est un défaut). (3) 🚨 LA CA CONFORME, ET ELLE EST POSÉE EN PREMIER. La CA du parc (1712 o) N'A AUCUNE EXTENSION X509v3 : `openssl s_client` la valide, mais Python 3.13 — dont `create_default_context()` active VERIFY_X509_STRICT par défaut — la REFUSE, avec un message qui égare (« Missing Authority Key Identifier ») ; le vrai motif n'apparaît qu'avec `openssl verify -x509_strict` (« error 79: invalid CA certificate »). Constaté sur ben-0001 le 19/09 au premier hello réel. La CA a été RÉÉMISE avec la MÊME CLÉ et le même sujet, donc les 11 certificats de boîtiers déjà émis restent valides — vérifié un par un avant déploiement. Démarrer le publisher avant de poser cette CA garantirait l'échec du premier hello. ⭐ GARDE-FOU CENTRAL : avant de remplacer quoi que ce soit, le script exige que la NOUVELLE CA VALIDE LE CERTIFICAT DE CE BOÎTIER (`openssl verify -CAfile`) — poser une CA qui ne correspond pas le couperait définitivement du cloud, en silence. L'ancienne est sauvegardée horodatée à côté. 🚨 CE QUI NE FAIT PAS ÉCHOUER L'UPDATE : un boîtier sans certificat, ou un cloud injoignable. Le publisher a Restart=always, il réessaiera seul ; faire échouer l'update la ferait REJOUER tous les 10 min pour toujours — la mécanique exacte qui a brûlé pi-0.9.12. Un contrôle d'effet ne vérifie QUE ce dont l'update est responsable. Contrôles : préflight (ast.parse — JAMAIS py_compile, qui écrit dans __pycache__ appartenant à root alors que l'OTA tourne en `ben`), CA du dépôt conforme ET strictement auto-valide, CA installée identique et validant device.crt, unité connue de systemd, /health de l'API locale avec db:true. AUCUNE migration, aucune table, aucune colonne — le publisher ouvre la base en LECTURE SEULE. UNIVERSEL (LoRa et filaire). ✅ SCRIPT EXÉCUTÉ TEL QUEL SUR ben-0003 LE 21/09 À 20:11 (0.9.14, filaire, portant encore l'ancienne CA — donc exerçant réellement le remplacement) : code 0, tous contrôles verts, et effet constaté côté serveur dans la seconde — `hello OK` puis `envoyé 500 · inséré 500`.
