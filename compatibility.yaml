    script: "updates/0.9.15_to_0.9.16/update.sh"   # LE BOÎTIER ENTRETIENT SON PROPRE CERTIFICAT. POURQUOI : mesuré le 23/09 sur iPhone 11 / iOS 26.5, trois certificats portant LA MÊME CLÉ PRIVÉE, seul le certificat changeant — CN seul 10 ans : Android OK, iOS REFUSE ; CN+SAN 10 ans : Android OK, iOS REFUSE ; CN+SAN 397 jours : iOS ACCEPTE. Une seule variable, la DURÉE : Apple plafonne les certificats SERVEUR à ~398 jours MÊME avec une CA privée fournie par l'application. Les certificats du parc font 3650 jours — inutilisables pour le futur HTTPS local, et il faut pouvoir les remplacer à répétition, tous les six mois, sans se déplacer. LIVRE : (1) `src/pi/certd/ben_certd.py`, l'agent — réveil quotidien à GIGUE PLEINE (`random.uniform(période/2, période)`, pas un intervalle fixe, sinon toute la flotte se réveille ensemble après une coupure générale), GET :8444/ pour obtenir une directive, et RIEN en mémoire : l'état vit côté serveur, sinon les deux pourraient diverger et ce serait toujours le boîtier qui aurait tort sans moyen de le savoir. (2) `ben-certd.service`, sans [Install]/WantedBy — c'est `ben-network-check` qui le lance, dans la MÊME branche que les lecteurs : provisionné ET en ligne. Ni WatchdogSec ni StartLimitAction=reboot — un agent de certificat qui tombe ne doit JAMAIS rebooter le Pi (leçon du verrou taint, 0.9.12). (3) `/etc/sudoers.d/ben-certd` : UN verbe, UNE unité, `systemctl restart ben-publisher`. Nécessaire parce que le publisher charge son certificat UNE SEULE FOIS, à la construction de son contexte SSL, puis tient une connexion persistante — sans redémarrage il continuerait indéfiniment avec l'ancien, SANS LA MOINDRE ERREUR, et ben-api enregistrerait l'ancien certificat : divergence silencieuse dans la table même qui pilote la bascule du parc. (4) `check_network.py` démarre certd à côté du publisher — via le helper `_start()`, jamais un subprocess en dur : les deux lignes qui l'avaient fait (publisher, 0.9.15) échappaient au banc `test_network_recovery.py` et l'ont laissé ROUGE pendant trois versions sans que personne ne le voie. 🚨 LE RISQUE PROPRE À CETTE VERSION EST LE SUDOERS : un fichier malformé dans /etc/sudoers.d casse `sudo` POUR TOUT LE MONDE, sur un boîtier qu'on ne peut pas dépanner à distance. D'où `visudo -cf` sur la SOURCE AVANT toute installation (vérifier après serait vérifier depuis l'intérieur du trou), mode 0440 root:root — sudo refuse EN SILENCE un fichier accessible en écriture à autrui — puis `visudo -c` sur la configuration GLOBALE, celle que sudo relira réellement. GARDES DE L'AGENT, du moins cher au plus cher, et l'ORDRE COMPTE : (a) pas déjà expiré — EN PREMIER, parce que `openssl verify` contrôle les dates DANS la validation de chaîne : placé après, ce contrôle ne serait JAMAIS atteint et un certificat expiré serait journalisé « chaîne invalide » (trouvé par le banc, pas par relecture) ; (b) chaîne valide contre le root-ca.crt DU BOÎTIER ; (c) 🚨 la clé publique correspond à `device.key` — LE garde qui évite la brique définitive, un certificat qui ne correspond pas à la clé locale rend le boîtier MUET et sans mTLS il ne peut même plus signaler qu'il est cassé ; (d) le CN est bien le sien ; (e) ⭐ une poignée de main mTLS COMPLÈTE avec le candidat pendant que l'ancien est encore en place — on ne DÉDUIT plus qu'il marchera, on l'a UTILISÉ. Puis écriture atomique (`os.replace`), ancien conservé à côté. 🚨 CE QUI NE FAIT PAS ÉCHOUER L'UPDATE : un boîtier sans certificat, ou un cloud injoignable. certd a Restart=always, l'ancien certificat reste valide jusqu'à son échéance et il n'y a JAMAIS urgence à renouveler ; faire échouer l'update la ferait REJOUER tous les 10 min pour toujours — la mécanique qui a brûlé pi-0.9.12. PRÉFLIGHT : ast.parse — JAMAIS py_compile, qui écrit dans __pycache__ appartenant à root alors que l'OTA tourne en `ben` — sur ben_certd.py ET sur check_network.py (une erreur de syntaxe dedans ne casse pas cette update, elle casse le PROCHAIN BOOT en silence et laisse un boîtier sans aucun lecteur), plus un grep exigeant que check_network démarre bien ben-certd. CONTRÔLE D'EFFET : sudoers en place et configuration globale valide, unité connue de systemd, agent LISIBLE PAR `ben` (il l'exécute), /health de l'API locale avec db:true, publisher toujours actif. On ne vérifie PAS que certd a joint ben-api ni qu'un certificat a été renouvelé : ça dépend du réseau, du serveur et d'un geste opérateur — pas de nous. AUCUNE migration, aucune table, aucune colonne — certd ne touche pas à la base. UNIVERSEL (LoRa et filaire) : entretenir son certificat n'est pas une propriété du matériel, c'est une fonction de flotte. Côté boîtier documenté dans docs/pki-renouvellement.md (ce dépôt est PUBLIC — la politique serveur n'y figure pas). ✅ SCRIPT EXÉCUTÉ TEL QUEL SUR ben-0003 LE 24/09 À 11:50 — boîtier FILAIRE en 0.9.15, dépôt propre, n'ayant NI l'agent, NI l'unité, NI le sudoers : donc exerçant réellement l'installation fraîche, y compris le geste sudoers. Code de sortie 0, tous contrôles verts. Effet constaté dans la foulée : « CSR déposé (202) — motif : durée 3650 j > 180 j », CSR visible côté opérateur, signé puis armé, et au tour suivant « certificat remplacé », « ben-publisher redémarré », « acquitté auprès de ben-api (204) » — tâche fermée, inventaire serveur passé de 3650 à 180 jours. Le dépôt du boîtier a ensuite été remis propre (`git status` vide) pour que le `git checkout pi-0.9.16` de l'OTA ne bute pas sur des fichiers non suivis.
  - from: "0.9.16"
    to:   "0.9.18"
    tag:  "pi-0.9.18"
    script: "updates/0.9.16_to_0.9.18/update.sh"   # LE LECTEUR TIC VÉRIFIE LA PARITÉ, ET ON RÉPARE LES DÉGÂTS DE 0.9.17. 🚨 pi-0.9.17 EST BRÛLÉE : son CODE était bon, son SCRIPT avait deux défauts enchaînés. ① La garde censée épargner les boîtiers sans lecteur filaire ne jouait JAMAIS — `systemctl cat ben-tic-reader.service` réussit dès que le FICHIER D'UNITÉ existe, et l'image dorée le pose sur TOUS les boîtiers ; tester l'existence d'un fichier ne dit RIEN sur ce qui doit tourner. ② Donc le script atteignait `systemctl restart ben-tic-reader`, or cette unité est `static` (pas de [Install], pas activée : c'est `check_network` qui la démarre d'après les CAPABILITIES) et ⚠️ `restart` sur un service ARRÊTÉ le DÉMARRE. MESURÉ sur un boîtier radio : 0 plantage du lecteur dans les trois jours précédant le tag, 2 538 dans les neuf heures suivantes — il perd la course au GPIO de la LED contre `ben-radio`, qui en est le propriétaire (`lgpio.error: 'GPIO not allocated'`), et systemd le relance sans fin ; le contrôle d'effet échouant, `device.json` n'était pas bumpé et l'update REJOUAIT toutes les 10 min (53 cycles constatés) — la mécanique exacte de pi-0.9.12. ⭐ LA RÈGLE QUI EN SORT, VALABLE POUR TOUTE UPDATE : **une update redémarre ce qui TOURNE, elle ne démarre JAMAIS ce qui ne tourne pas** ; ce qui doit tourner est une décision de `check_network` à partir des capabilities, et une update n'a ni à la reprendre ni à la contredire. CE QUE FAIT CE SCRIPT : (1) préflight universel — les deux fichiers du correctif présents, compilant (`ast.parse`, JAMAIS `py_compile` qui écrit dans un `__pycache__` appartenant à root alors que l'OTA tourne en `ben`), l'import branché (un correctif livré mais non appelé serait une update qui ne change rien, en silence), et `octet_valide` éprouvé HORS LIGNE sur trois affirmations dont un TÉMOIN — sans lui, un contrôle qui refuserait TOUT passerait les deux autres ; (2) RÉPARATION — si le boîtier ne déclare pas `tic-uart` et que le lecteur tourne quand même, c'est 0.9.17 qui l'a lancé : on l'arrête, et on vérifie qu'il RESTE arrêté ; (3) s'il déclare `tic-uart`, on ne le redémarre QUE s'il tournait déjà, et on exige une trame ensuite — uniquement s'il en lisait avant, sinon un câble TIC débranché ferait échouer l'update et la ferait rejouer pour toujours. ⭐ LA DÉCISION VIENT DES CAPABILITIES, JAMAIS DU MODÈLE : `device.json.model` porte depuis 0.8.0 un LABEL commercial (« Radio », « Filaire ») et s'y fier a déjà été supprimé en 0.9.12 ; on interroge `capabilities.py`, la même source que `check_network`. Et capabilities illisibles ⇒ on ne touche à AUCUN service. LES TROIS MODÈLES, dont le troisième que 0.9.17 aurait cassé aussi : `pi0-wired` (tic-uart) redémarrage encadré · `pi0-lora` (lora + lora-tic-receiver, PAS tic-uart) arrêt du lecteur si 0.9.17 l'a lancé · `pi0-lora-wired` (les trois) les deux lecteurs coexistent, et `ben-radio` possède le GPIO — d'où l'ordre qui compte. AUCUNE migration, aucune table, aucune colonne.
  - from: "0.9.17"
    to:   "0.9.18"
    tag:  "pi-0.9.18"
    script: "updates/0.9.17_to_0.9.18/update.sh"   # ALIGNEMENT DE VERSION, RIEN D'AUTRE. Les boîtiers FILAIRES qui ont pris 0.9.17 n'ont rien subi : le lecteur y tournait déjà, donc `restart` l'a bien redémarré et le contrôle d'effet a été vert. Leur code est DÉJÀ celui de 0.9.18 — les deux tags portent le même arbre pour le lecteur TIC. Il ne reste qu'à aligner le numéro, pour que le parc soit sur un seul palier et que la prochaine transition n'ait qu'un `from` à gérer. 🚨 CE QU'ELLE NE FAIT SURTOUT PAS : redémarrer le lecteur. Il tourne, il lit, son code est le bon — le redémarrer coûterait des secondes de mesures sur chaque boîtier du parc pour rien, et rouvrirait la fenêtre de course au GPIO de la LED sur un `pi0-lora-wired`. ⚠️ « Ça ne coûte rien de redémarrer par précaution » est faux deux fois : ça coûte des mesures, et ça expose à un mode de panne qu'on vient justement de payer. CE QU'ELLE FAIT QUAND MÊME : elle VÉRIFIE le checkout (fichiers présents, compilent avec `ast.parse`, import branché). Un tag est une chose qu'on peut rater, et un fichier manquant doit être vu MAINTENANT — tant que rien n'a bougé — plutôt qu'au prochain redémarrage du lecteur, c'est-à-dire au prochain reboot, des semaines plus tard, sans que personne ne relie la panne au tag. Le coût est nul et le bénéfice est un échec PROPRE : `device.json` non bumpé, rien touché, nouvelle tentative au tick suivant — un boîtier en 0.9.17 avec un lecteur qui tourne est un état parfaitement sain, il n'y a aucune urgence à en sortir. N'utilise même pas sudo.
  - from: "0.9.18"
    to:   "0.9.19"
    tag:  "pi-0.9.19"
    script: "updates/0.9.18_to_0.9.19/update.sh"   # NE JAMAIS ÉCRIRE SOUS UN pdl_index DEVINÉ (#6). Trois portes fermées. ① `resolve_pdl` créait un PDL pour tout ADCO inconnu : son garde testait le VIDE, pas la FORME, et `.strip()` ne retire pas les octets NUL — `'\x00\x00'` passait, et deux octets de rien ont créé un PDL portant 13 056 mesures sur un boîtier du parc. Nouveau prédicat PUBLIC `db.adco_valide()` : douze chiffres ASCII, miroir exact du `CHECK (ads ~ '^[0-9]{12}$')` du cloud, mais posé LÀ OÙ LA DONNÉE NAÎT. `isascii()` n'est pas décoratif : `isdigit()` est VRAI des chiffres Unicode, donc `'²'*12` créerait un PDL que le cloud refuserait. ② `PDL_INDEX` valait 0 à l'amorce du lecteur filaire — or 0 est l'index du PREMIER compteur de tout boîtier, donc l'amorce et une vraie réponse étaient INDISCERNABLES : un boîtier déplacé puis redémarré écrivait ses premières mesures sous son ANCIEN compteur, en silence. Sentinelle `None` + prédicat pur `peut_stocker(conn, pdl_index)` comme seul juge du droit d'écrire. ③ Un ADCO non conforme condamne la TRAME ENTIÈRE, pas seulement son groupe : on n'atteint ce contrôle que par un groupe ayant passé LA PARITÉ ET LE CHECKSUM sans avoir la forme d'un ADCO, donc par l'amputation dans l'angle mort du checksum (caractères retirés sommant à un multiple de 64) — et cet angle mort vaut pour TOUS les groupes de la trame. L'ADCO est le SEUL champ de la TIC dont la forme soit connue d'avance : c'est le seul témoin qu'on ait de cet angle mort. Côté LoRa, une trame de boot sans identité valable est écartée EN ENTIER — le MAC ChaCha20 prouve que les octets sont ceux émis, donc un ADCO difforme dit que l'ÉMETTEUR a mal lu sa TIC, et ISOUSC/PREF/CONTRAT viennent de la MÊME lecture. 🚨 `frame_ok` reste HORS du garde de stockage et `TRAME_CONDAMNEE` est DISTINCT de `None` : une trame condamnée prouve que la liaison est VIVANTE, la confondre avec une trame absente relancerait le process toutes les 10 min — le mode de défaillance qui a brûlé pi-0.9.12. Défaut trouvé EN REVUE, couvert par un banc dédié. 🚨 LE SCRIPT NE REDÉMARRE PAS ben-radio : `capabilities.py` mappe `lora-tic-receiver` sur ben-radio ET ben-telemetry, mais la façade radio n'est pas touchée (elle n'importe même pas db.py) et son redémarrage porte le risque SPI/taint de 0.9.12 — on se sert de `capabilities has` pour DÉCIDER, on nomme les unités à la main. Il ne DÉMARRE pas non plus ce qui ne tournait pas (leçon de 0.9.17). Préflight : ast.parse (JAMAIS py_compile, __pycache__ root) + `adco_valide` ÉPROUVÉ sur la cible AVEC SON TÉMOIN — sans lui, un garde refusant tout passerait tous les cas de refus et le boîtier ne créerait plus jamais de PDL en silence. Contrôle d'effet sur /health (db:true ET last_tic_ts qui avance), JAMAIS /info. AUCUNE migration, aucune table, aucune colonne. Éprouvé 20 h sur un boîtier filaire et 4 h sur un boîtier LoRa, bancs joués sur les Pi Zero eux-mêmes.
  - from: "0.9.19"
    to:   "0.9.20"
    tag:  "pi-0.9.20"
    script: "updates/0.9.19_to_0.9.20/update.sh"   # LE PUBLISHER RATTRAPE SON RETARD (#13). Un boîtier à COURTE FENÊTRE DE CONNECTIVITÉ ne rattrapait jamais : il envoyait 500 points toutes les 60 s — 500/min — pour une production radio de 64,5/min, soit un débit NET de 435/min, donc PLUS DE 3 H 30 de connectivité par jour rien que pour ne pas reculer ; en dessous l'écart grandissait chaque jour. ⭐ LE GOULOT N'ÉTAIT PAS LA TAILLE DU LOT, et c'est la MESURE qui l'a tranché : sur un Pi Zero du parc, un aller-retour coûte 206 ms pour 500 points, 400 ms pour 1000, 690 ms pour 2000 — le lot part en ~0,4 s puis le service dormait 60 s, il travaillait 0,7 % du temps. Augmenter BATCH seul n'aurait presque rien gagné : le sommeil se paie PAR LOT, pas par point, donc les deux paramètres se décident ensemble. BATCH 500 → 1000 et PERIOD_RETARD=10 s tant que `pending_approx() >= BATCH` : le seuil de survie tombe de ~3 h 30/jour à ~16 min. ⚠️ 10 s ET NON 0 : un sommeil nul, c'est tout le parc à plein débit sur l'API en même temps après une panne d'opérateur — profil que la VM DEV1-S n'a jamais vu, budget mémoire déjà tendu. À 10 s la charge parc plafonne à ~670 points/s pour sept boîtiers, et 16 min reste largement au-delà du besoin. ⭐ `pending_approx()` est O(1) (il encadre par les rowid, un `count(*) WHERE sent=0` prenait 37 s sur Pi Zero) et il était DÉJÀ appelé à chaque lot. 🚨 DÉFAUT TROUVÉ EN REVUE : cet appel interroge la base et se fait HORS du `try` de la boucle — `_sleep(PERIOD)` ne pouvait rien lever, celui-ci si (verrou tenu, E/S carte SD), et l'exception remontait hors de main(), tuant le process sans passer par le backoff. `cadence_sure()` l'attrape, avec un repli sur PERIOD et JAMAIS PERIOD_RETARD — ne pas savoir mesurer le retard ne doit pas faire ACCÉLÉRER — et sans incrémenter `echecs`, qui parle du SERVEUR. ⚠️ Le chemin d'échec est inchangé : il sort par `continue` en gardant son backoff exponentiel à gigue totale, donc un serveur en panne ne déclenche JAMAIS la cadence de rattrapage. 🚨 CE SCRIPT NE TOUCHE QUE ben-publisher : ni les lecteurs, ni ben-radio, ni ben-local-api ne partagent de code avec ce changement. 🚨 ET LE CONTRÔLE D'EFFET N'EST PAS CELUI DES VERSIONS PRÉCÉDENTES : `last_tic_ts` prouve qu'un LECTEUR lit, il ne prouve RIEN sur le publisher, qui n'écrit pas dans `measurements`. Le reprendre donnerait un vert qui ne veut rien dire — le défaut de pi-0.9.12 sous une autre forme. On contrôle donc : le service debout, ET IL LE RESTE (NRestarts inchangé après 15 s, car `is-active` juste après un `restart` ne voit pas une boucle de plantage), plus une trace d'activité au journal. Préflight : ast.parse (JAMAIS py_compile) + la CADENCE ÉPROUVÉE avec ses témoins — une cadence inversée laisserait le service « active » tout en RALENTISSANT quand le boîtier prend du retard, ce qu'aucun contrôle de service ne verrait. AUCUNE migration.
  - from: "0.9.20"
    to:   "0.9.21"
    tag:  "pi-0.9.21"
    script: "updates/0.9.20_to_0.9.21/update.sh"   # ÉRADIQUER LES FANTÔMES DÉJÀ ENTRÉS (#7). 0.9.19 a fermé la porte ; celle-ci répare ce qui était DÉJÀ dedans. C'est une MIGRATION DE DONNÉES, pas une livraison de code — aucun .py de service n'est modifié, et ça change la nature du risque : les cinq updates précédentes risquaient « le service ne repart pas », visible tout de suite ; celle-ci risque « on a supprimé la mauvaise ligne », IRRÉVERSIBLE, sur des bases qui NE SONT PAS SAUVEGARDÉES. ⭐ UNE SEULE CAUSE POUR DEUX SYMPTÔMES : un caractère de la trame TIC dont le BIT 6 s'est mis à 1 (`0`→`p`, `1`→`q`, `.`→`n`). 0x40 vaut 64 et le checksum TIC est `(somme & 0x3F) + 0x20` — AVEUGLE à tout multiple de 64 : `HC..` et `HCn.` ont le MÊME checksum, 0x47. Relevé dans le cloud le 30/09 sur un boîtier filaire du parc : trois ADCO fantômes (un `0`→`p`, un autre `0`→`p`, un `1`→`q`) portant UNE mesure chacun, et quatre époques tarifaires `HC..`→`HCn.`. La parité matérielle de 0.9.18 ferme cette porte (un seul bit retourné rend la parité fausse) ; ici on nettoie derrière. ⭐ LA RÈGLE DES ÉPOQUES TIENT EN UNE LIGNE : la PREMIÈRE époque est la référence, toute autre qui lui ressemble sur les DEUX PREMIERS CARACTÈRES part. Elle décrit le mécanisme directement — un bit retourné n'abîme QU'UN caractère, donc le préfixe concorde toujours. Pourquoi le préfixe et pas une durée : une époque TERMINALE n'a pas de successeur, donc aucune durée mesurable, et c'est pourtant celle qui compte — c'est elle que lisent /registers et tout calcul de coût. Pourquoi « ressemble » et non « diffère » : les abîmées naissent en PAIRE (le lecteur rouvre une époque en revenant au vrai contrat 1 à 4 s plus tard), et la jumelle est IDENTIQUE à la référence — la même condition emporte les deux, et il ne reste qu'une ligne là où cinq disaient la même chose. ⚠️ CE QU'ELLE NE FAIT PAS, ASSUMÉ : un RETOUR au contrat d'origine (BASE→TEMPO→BASE) serait effacé lui aussi et le boîtier resterait cru en TEMPO — aucun boîtier du parc n'est dans ce cas, BASE/TEMPO/HC../BBR( diffèrent tous dès le 2e caractère, et un banc ÉPINGLE cette limite pour qu'on ne la redécouvre pas sur le terrain ; et le `'3'` vu sur un boîtier radio lui échappe (trame TRONQUÉE, pas bit retourné, aucun préfixe commun avec BASE) — autre maladie, traitée à la main. 🚨 LES MESURES SONT RÉ-ATTRIBUÉES, JAMAIS SUPPRIMÉES : elles viennent du vrai compteur, seul leur classement était faux — `UPDATE … SET pdl_index=<vrai>, sent=0` pour qu'elles repartent au cloud, qui les a reçues sous un PDL qui n'existe plus. Les autres tables ne portent que des dérivés d'une trame mal lue. Et `emitter` n'est pas SUPPRIMÉE mais RÉ-ORIENTÉE : sans sa ligne, une trame de courbe n'aurait plus où se ranger tant qu'aucune trame de boot n'est repassée. 🚨 GARDE : ré-attribuer suppose de savoir VERS QUI — avec zéro ou plusieurs PDL sains la destination est indécidable, on sort sans RIEN toucher. 🚨 LE CONTRÔLE D'EFFET EST UN INVARIANT, PAS UN COMPTE : le succès n'est PAS « j'ai supprimé quelque chose » — sur six boîtiers du parc il n'y a rien à faire et c'est un succès ; exiger un effet ferait échouer l'update partout ailleurs, `device.json` ne serait pas bumpé et elle REJOUERAIT toutes les 10 min, la mécanique exacte qui a brûlé pi-0.9.12. On vérifie « la base est conforme » (aucun PDL difforme, aucune époque abîmée, aucune orpheline dans les 9 tables), vrai AVANT comme APRÈS sur un boîtier propre — et c'est aussi la PORTE DE SORTIE anticipée, pas un compte de fantômes, sinon une orpheline sans rapport ferait afficher « déjà conforme » sans rien avoir vérifié. 🚨 COROLLAIRE, VALABLE POUR TOUTE MIGRATION DE DONNÉES : AUCUN ÉTAT DE LA DONNÉE NE FAIT ÉCHOUER CETTE UPDATE — ni le REFUS (0 ou 2+ PDL sains : « je ne sais pas vers qui réattribuer » est voulu), ni un invariant encore faux (une anomalie que ce ménage-ci ne sait pas réparer ne rend la base ni pire ni urgente). Échouer laisserait device.json non bumpé, donc rejeu toutes les 10 min, et ce serait DÉFINITIF puisque aucune version ultérieure ne pourrait plus atteindre le boîtier. Seuls le préflight (code cassé, on veut retenter au prochain tag) et « un service arrêté n'est pas revenu » (dégât réel) peuvent échouer. ⚠️ ben-publisher est arrêté LUI AUSSI bien qu'il n'écrive aucune mesure : il lit un lot de sent=0, le POSTE, puis marque sent=1 PAR ROWID — un lot parti sous le pdl_index fantôme juste avant le ménage verrait ses lignes déplacées puis marquées envoyées, et le cloud ne les recevrait JAMAIS sous le bon compteur. ⚠️ Et `abimes` exclut la valeur de RÉFÉRENCE : la purge emporte les époques abîmées ET leurs jumelles, dont le contrat est le BON — les confondre supprimerait le tariff_labels légitime en croyant retirer le chimère (défaut trouvé par le banc). ⭐ ET RIEN À FAIRE ⇒ AUCUN SERVICE TOUCHÉ : on sort avant même d'arrêter quoi que ce soit, parce qu'un redémarrage de lecteur coûte des mesures (leçon de 0.9.17). SAUVEGARDE OBLIGATOIRE des lignes visées dans /var/tmp AVANT d'écrire, refus d'agir si elle n'a pas pu être écrite, et le banc exige qu'elle se REJOUE — un fichier qu'on ne peut pas réinjecter n'est pas une sauvegarde, c'est un souvenir. 🚨 LE GESTE QUI DÉCIDE sur un boîtier radio : ben-telemetry garde `_pdl_par_emetteur` EN RAM et continuerait d'écrire sous le fantôme quelle que soit la requête SQL — d'où l'arrêt, pas un simple restart. ben-radio n'est JAMAIS touchée (elle n'importe même pas db.py, et son redémarrage porte le risque SPI/taint de 0.9.12) : on se sert de `capabilities has` pour DÉCIDER, on nomme les unités à la main, et on ne redémarre QUE ce qui tournait. MARCHE À BLANC d'abord, journalisée — le boîtier concerné est INJOIGNABLE (fenêtres de connectivité courtes, pas de SSH), donc le journal et le bump de version sont TOUT ce qu'on relira ; la marche à blanc « sur la cible » de l'issue est remplacée par un banc qui RECONSTITUE la maladie à l'identique (`test_menage_fantomes.py`, 10 cas dont le témoin « une vraie bascule de contrat survit » — sans lui, une règle qui supprimerait TOUT passerait tous les cas de suppression et effacerait le passage en Tempo d'un boîtier du parc). Préflight : ast.parse (JAMAIS py_compile, __pycache__ root) + la RÈGLE ÉPROUVÉE SUR LA CIBLE avec son témoin, sur une base EN MÉMOIRE. Contrôle final sur /health (db:true), jamais /info. ⚠️ LE HELLO EST UNE FUSION (`ON CONFLICT DO UPDATE`, jamais de DELETE) : nettoyer le boîtier ne nettoie PAS le cloud, et nettoyer le cloud AVANT le boîtier se fait défaire au hello suivant. L'ordre est boîtier d'abord, serveur ensuite. AUCUNE migration de schéma, aucune table, aucune colonne.
