    script: "updates/0.9.22_to_0.9.23/update.sh"   # UN ÉCHEC QUI PERSISTE EST UNE ERREUR, PAS UN AVERTISSEMENT (#18). pi-0.9.22 a livré l'instantané de santé et il a DÉMENTI TROIS DIAGNOSTICS SUCCESSIFS sur le boîtier qui motivait tout le chantier : il MESURE (une trame toutes les 38 s, à l'instant), il est EN LIGNE (hello 204 en 17 ms, WiFi à -40 dBm — donc aucune « fenêtre courte »), son publisher TOURNE (active/running, 0 redémarrage), il a 566 248 POINTS EN ATTENTE (8,8 jours, exactement l'écart observé depuis le 22/09) — et RIEN NE PART, aucun POST en quatre minutes là où il devrait en faire un toutes les 10 s. ⇒ IL MESURE ET NE PUBLIE PAS, soit le deuxième des trois états que `last_seen` confond, celui qu'on croyait déjà visible. 🚨 ET LE DIAGNOSTIC À DISTANCE NE POUVAIT PAS VOIR POURQUOI : ben_publisher journalisait TOUS ses échecs en `log.warning`, priorité syslog 4, UN CRAN SOUS le `-p 3` de la sonde `errors`. La seule ligne qui expliquait tout était sous le seuil qu'on avait choisi. 🚨 ET LE PREMIER CORRECTIF ÉCRIT POUR CE TAG NE SERVAIT À RIEN : monter `log.warning` en `log.error` ne change que le TEXTE, car `logging.basicConfig()` écrit sur stderr et systemd range tout ce qui vient de stderr à une priorité FIXE (SyslogLevel=6). Mesuré sur un boîtier du parc sur un vrai échec : « [WARNING] échec n°1 ([Errno -3] Temporary failure… » stocké en PRIORITY=6. La sonde interroge `journalctl -p 3` : elle ne voyait RIEN, et le banc comme le préflight étaient VERTS parce qu'ils n'éprouvaient que `niveau_echec()`, une fonction juste et SANS EFFET. ⭐ UN CONTRÔLE QUI VÉRIFIE UNE DÉCISION SANS VÉRIFIER SON EFFET EST UN CONTRÔLE QUI MENT. ⭐ LE VRAI CORRECTIF EST LE PRÉFIXE `<N>` : le mécanisme documenté de systemd (SyslogLevelPrefix=yes, actif par défaut) lit la priorité en tête de ligne, l'applique et la retire du message — vérifié sur la cible avec le vrai `installer_journal()`, `<4>` donne PRIORITY=4 et `<3>` donne PRIORITY=3. Zéro dépendance, pas de python-systemd à embarquer. ⚠️ Et l'explication du serveur VOYAGE désormais avec l'exception : la ligne escaladée portait « HTTP 400 » SANS LE CORPS, soit un refus sans sa raison — or un 400 ou un 413 ne se résout PAS en réessayant, et le corps est la seule chose qui dira lequel. ⭐ ET LA DÉCISION, qui ne vaut que posée sur ce socle : au-delà de ECHECS_ERREUR échecs consécutifs l'échec passe en `log.error`, donc en priorité 3, donc visible à la sonde. Un réseau cligne, échouer une fois n'est pas une erreur — mais au-delà ce boîtier NE LIVRE PLUS SES DONNÉES, l'état le plus grave qu'il puisse connaître sans être mort. Monter le niveau coûte ZÉRO et rend la panne visible, à la sonde comme à qui lit le journal directement. ⚠️ Et pas `error` dès le premier échec : un niveau qui crie tout le temps ne garde plus rien, on cesse de le regarder — même raisonnement que la gigue totale. Seuil à 5, de l'ordre de la minute cumulée avec la gigue, et STRICTEMENT sous le plafond de backoff (~9 échecs) sinon la panne ne serait visible qu'après des dizaines de minutes de silence ; un cas de banc l'exige. La décision est extraite en FONCTION PURE (`niveau_echec`), comme `cadence` — c'est ce qui la rend éprouvable sans réseau ni base, et le préflight l'ÉPROUVE SUR LA CIBLE avec son témoin (un niveau qui rendrait toujours `warning` laisserait la panne invisible comme avant ; un qui rendrait toujours `error` noierait le journal, ce qui est l'autre façon de la rendre invisible). ⭐ ET LA SONDE `pub`, ABANDONNÉE PUIS RÉTABLIE : les 5 dernières lignes du journal de ben-publisher, SANS filtre de priorité. Je l'avais retirée au motif qu'`errors()` remonte déjà la priorité 3 — ⚠️ FAUX POUR LE MOMENT QUI COMPTE : le hello part JUSTE APRÈS le redémarrage du publisher par l'OTA, et à cet instant le nouveau processus a `echecs = 0` (aucune ligne en priorité 3 n'existe encore) tandis que celles de l'ANCIEN sont en PRIORITY=6 sur tout boîtier antérieur à ce tag. ⇒ sans `pub` la cause d'une panne de publication n'arriverait qu'au hello SUIVANT, sous 24 h ; avec, elle arrive au PREMIER, quelques minutes après l'OTA. ⚠️ Et sans filtre de priorité, c'est ce qui la rend SÛRE : `-u` ne dégénère en balayage complet que s'il n'y a AUCUNE correspondance — journald parcourt alors tout le journal pour n'en trouver aucune, et c'est de là que venaient les 7,93 s de `-u ben-radio -p 3 -n 8` contre 0,36 s sans `-u` ; les lignes INFO du publisher garantissent toujours une correspondance, donc la lecture reste une lecture de QUEUE. ⚠️ Elle passe EN DERNIER : l'ordre des sondes est une liste de priorité et l'échéance globale sacrifie la dernière en premier. Le nombre de points réellement insérés est journalisé CÔTÉ SERVEUR (ben-api#8), là où le chiffre était déjà calculé et jeté. BUDGET_S 12 -> 20 s : le coût de la collecte VARIE DE 2 À 10 s SUR LE MÊME BOÎTIER selon l'état du cache du journal — trois passages consécutifs à 2 029/1 998/2 088 ms quand le même code venait d'en mettre 9 655 (carte SD occupée, charge à 1,9). Avec 12 s la marge était d'une seconde et demie sur le pire cas observé, et c'est la DERNIÈRE sonde qui aurait été sacrifiée. ⓘ CORRIGE AUSSI LE COMMENTAIRE SUR `tainted` : il annonçait « 1024 = TAINT_WARN », faux deux fois — TAINT_WARN est le bit 9 (512), et 1024 est le bit 10, « un pilote staging a été chargé » (snd_bcm2835, vc_sm_cma, bcm2835_mmal_vchiq, bcm2835_isp), soit l'état NORMAL de Raspberry Pi OS. 1024 est donc le PLANCHER et le présenter comme remarquable était trompeur ; ce qui compte est tout bit AU-DELÀ : 128 = le noyau est mort récemment (OOPS/BUG, vécu sur un boîtier), 16384 = soft lockup soit la signature d'un SPI figé, 512 = WARNING. Donc 1152 = Pi normal PLUS un oops. La valeur lue n'a jamais changé, seule l'interprétation était fausse — on stocke le masque BRUT et on décode à la lecture. CE SCRIPT NE TOUCHE À AUCUN SERVICE, comme le précédent : le seul concerné est ben-publisher, que check_update.py redémarre systématiquement à son étape 10. Il rejoue l'ajout de `ben` au groupe systemd-journal (idempotent) au cas où il aurait échoué en 0.9.22 — sans ce groupe journalctl ne rend RIEN à `ben`, et le dit sur stderr donc en silence. ÉPROUVÉ : bancs à 23 (health) et 12 (cadence) cas, verts sur Mac et sur les DEUX modèles ; update.sh joué tel quel en `ben` — radio 5 679 ms / 3 055 o, filaire 2 104 ms / 2 094 o, code 0 sur les deux. AUCUNE migration, aucune table, aucune colonne.
