    to:   "0.9.25"
    tag:  "pi-0.9.25"
    script: "updates/0.9.24_to_0.9.25/update.sh"   # ON RÉPARE LA BASE CORROMPUE EN LA RECOPIANT (#23). pi-0.9.24 a livré le hello d'escalade et il a répondu VINGT SECONDES après l'OTA : « échec n°1 (database disk image is malformed) ». Ce n'était ni le réseau, ni la taille des lots, ni le serveur — une zone de la table `measurements` est ILLISIBLE et `fetch_batch` lève AVANT d'atteindre cli.post, donc le serveur n'a jamais rien eu à refuser. 61 lignes `malformed` sur deux instantanés, échec n°57 du processus précédent, neuf jours. ⭐ CE QUI MARCHE ENCORE DIT OÙ EST LE DOMMAGE : l'écriture va dans des pages NEUVES (8 322 lignes en 3 h 12, à 0,2 % du débit nominal) ; le hello lit `pdl` et `contract_epoch`, intactes ; `pending`, `unsent` et `pdl.last_ts` sont servis par des INDEX, qui sont des arbres SÉPARÉS ; `radio` lit rssi/snr donc des pages de table RÉCENTES, et réussit. Seul `fetch_batch` échoue, parce qu'il est le seul à lire 11 colonnes ET à partir du rowid non envoyé LE PLUS ANCIEN. Les écritures réussissant, la page corrompue n'est pas sur le chemin menant au bout de l'arbre : le dommage est dans la partie ANCIENNE. Cause probable : l'usure de la carte SD (~64 000 lignes/jour depuis le 1er août) — aucun logiciel ne répare ça, le changement de carte reste nécessaire. ① LA GARDE, TOUT LE PARC : une erreur SQLite a désormais sa propre branche AVANT le `except Exception`, avec son propre compteur ; elle n'incrémente plus `echecs` (qui parle du SERVEUR), se rendort sur PERIOD et jamais sur PERIOD_RETARD (ne pas savoir LIRE ne doit pas faire accélérer), et SIGNALE quand même. Le dépôt avait déjà le précédent sans l'appliquer là : `cadence_sure()` garde `pending_approx` avec exactement ce commentaire — « une base locale qui bronche n'est pas un serveur en panne ». ② LA SONDE CANARI, TOUT LE PARC : deux lectures de LIGNE COMPLÈTE dans l'instantané (0,56 ms pour la plus vieille non envoyée, 0,31 ms pour la plus récente — le plan de la seconde annonce SCAN measurements mais ORDER BY rowid DESC LIMIT 1 descend directement à la feuille la plus à droite). Rien ne signalait la panne parce que TOUS les autres champs qui touchent `measurements` passent par un index. ⚠️ Et ce n'est PAS un détecteur complet : un dommage au milieu des lignes déjà envoyées n'est lu par personne, donc invisible — c'est une alerte précoce sur le chemin de lecture du PUBLISHER, pas un integrity_check déguisé. Le champ est émis MÊME quand tout va bien (~30 o) : un champ qui n'apparaît qu'en panne est un champ qu'on oublie. ③ LA RECONSTRUCTION, UN SEUL BOÎTIER : on ne répare pas le fichier, on en construit un SAIN à côté. Recopie par tranches de rowid avec DICHOTOMIE sur les tranches qui lèvent, donc on ne perd que ce qui est RÉELLEMENT détruit. Écarté et pourquoi : VACUUM INTO relit toutes les pages et avorte ; Connection.backup() copie page par page SOUS les arbres donc recopierait la corruption à l'identique (le piège est qu'il RÉUSSIRAIT) ; `sqlite3 .recover` est l'outil fait pour ça mais le binaire est ABSENT des boîtiers (vérifié sur les deux modèles) ; DELETE/UPDATE récrit les pages corrompues. LA BASCULE : lien DUR puis os.replace, et l'ordre est le fond — renommer l'original puis mettre la neuve ferait DEUX renommages, et entre les deux il n'existe aucun `measurements.db`, donc une mort à cet instant ferait recréer une base VIDE au redémarrage. Le lien dur préexiste, il ne reste qu'un geste, et os.replace est atomique. L'original est conservé en `.corrupt-<horodatage>` et JAMAIS supprimé. LES SERVICES SONT DÉRIVÉS DES CAPABILITIES, pas d'une liste en dur : sur un boîtier Radio `ben-tic-reader` n'a rien à faire là (il y est dead avec 172 redémarrages, précisément parce qu'il est du modèle filaire). Et on ne REDÉMARRE que ce qui TOURNAIT. ⭐ `ben-certd` et `wifi-watchdog` ne sont PAS arrêtés : mesuré en lisant /proc/<pid>/fd sur un boîtier, seules trois unités ouvrent la base (ben-telemetry, ben-publisher, ben-local-api) ; couper wifi-watchdog vingt minutes sur une machine injoignable serait un risque sans contrepartie. `ben-radio` s'arrête en DERNIER (il possède le GPIO) et c'est explicite, pas émergent de l'ordre des clés de device.json. QUATRE GARDE-FOUS : ① ciblage par device.json — EXCEPTION ASSUMÉE, parce qu'un garde-fou d'identité est le seul qui ne puisse pas se tromper et qu'un faux positif voudrait dire arrêter les services d'un boîtier de terrain SAIN ; il échoue du bon côté (device.json illisible ⇒ on ne fait rien). ② IDEMPOTENTE : la garde de symptôme la donne presque entièrement (après réparation, `--refus` lit une base saine et sort sans rien arrêter), plus un FREIN de 3 tentatives incrémenté AVANT le travail pour qu'un SIGKILL compte. ③ UN FILET systemd-run TRANSIENT armé AVANT tout arrêt, parce que le trap de bash ne peut rien contre SIGKILL. ⓘ Aucun risque de timeout par ailleurs, c'est mesuré : check_update.py appelle subprocess.run sans `timeout=`, et ben-update.service étant Type=oneshot systemd lui donne TimeoutStartUSec=infinity (le défaut global est 1 min 30). ④ AUCUN ÉTAT DE LA DONNÉE NE FAIT ÉCHOUER L'UPDATE. LE HELLO EST DÉCLENCHÉ EXPLICITEMENT à la fin, avec le rapport de reconstruction dans `health.rebuild` — on ne se contente pas de celui que check_update.py provoque par effet de bord en redémarrant le publisher. ÉPROUVÉ : nouveau banc test_db_rebuild.py à 14 cas, dont un qui fabrique une VRAIE corruption de page et EXIGE que SQLite lève — trois montages ont été nécessaires et chaque échec était instructif (un count(*) se satisfait du plus petit INDEX sans toucher la table ; un UPDATE pour poser la frontière sent=0 RETOMBE sur la zone abîmée ; et SQLite remplit d'abord la dernière feuille EXISTANTE, donc la ligne charnière vit AVANT page_count, pas après). Le garde-fou du banc a refusé de passer les trois fois. Bancs 31 (health), 22 (cadence), 14 (rebuild) ; mutations vérifiées. ⚠️ LA DURÉE SUR CIBLE N'EST PAS MESURÉE : l'essai sur une copie de la base de 492 Mo d'un boîtier de banc a coïncidé avec un REDÉMARRAGE de ce boîtier (throttled=0x0, aucune erreur noyau, et ce boîtier redémarre de lui-même tous les 1 à 3 jours — causalité non établie). Seule la copie brute est retenue : 86 s pour 492 Mo. ⭐ Au passage, les uptimes du parc révèlent que CINQ boîtiers sur sept redémarrent tous les 3 à 5 jours sans que personne ne le sache, et que le seul à 60 jours d'uptime ininterrompu est précisément celui dont la base est corrompue. AUCUNE migration, aucune table, aucune colonne.
  - from: "0.9.25"
    to:   "0.9.26"
    tag:  "pi-0.9.26"
    script: "updates/0.9.25_to_0.9.26/update.sh"   # UN OCTET HORS ALPHABET TIC CONDAMNE SON GROUPE (#10). Enedis-NOI-CPT_54E 6.2.1.2 : le champ donnee ne porte que des ASCII IMPRIMABLES 0x20-0x7E, plus HT (0x09) separateur de champ en mode standard (5.3.6). L'alphabet legal est donc CONNU D'AVANCE, et tout octet hors de cet ensemble est une erreur PAR DEFINITION DE LA NORME, pas une heuristique. read_frame ne s'en servait pas : n'importe quel octet entrait dans le groupe et seul le checksum jugeait ensuite. LE DEFAUT EST UNE SUBSTITUTION, PAS UNE AMPUTATION — et je l'ai d'abord ecrit faux : l'octet n'etait pas JETE, il etait AJOUTE, donc le groupe gardait sa longueur et un de ses caracteres etait REMPLACE. Or c'est la que le checksum est aveugle : il vaut (somme & 0x3F) + 0x20, donc modulo 64. Remplacer un caractere par (c - 0x40) retire exactement 64, laisse le checksum IDENTIQUE, et donne un caractere de CONTROLE : T 0x54 -> 0x14, S 0x53 -> 0x13, I 0x49 -> HT. En historique « PTEC TH.. » devenait « PTEC 0x14 H.. », ACCEPTE — et en historique PTEC donne l'index_id. IL FAUT DEUX BITS, PAS UN, et le dire faux gonflerait la menace : un seul bit retourne casse TOUJOURS la parite, le compteur ayant calcule le bit de parite sur l'octet d'origine, donc octet_valide l'arrete et ce controle ne le voit jamais. Ce qui l'atteint est un nombre PAIR de bits dans le meme octet — typiquement le bit 6 de la donnee ET le bit de parite, qui redevient « juste ». C'est donc une COINCIDENCE RARE qu'on ferme, le meme arbitrage que celui deja ecrit dans tic_parite.octet_valide. Trois filtres independants, chacun couvrant l'angle mort des deux autres. CONDAMNER = SORTIR DE in_line : la branche CR teste deja in_line, donc la ligne ne voit jamais le checksum, qui ne peut pas trancher. Et on ne se contente pas de sauter l'octet : la ligne serait AMPUTEE, ce qui recree le trou de la parite (des caracteres retires dont la somme est un multiple de 64 laissent le checksum intact). TROIS DEFAUTS TROUVES EN REVUE, chacun avec son banc ecrit AVANT le correctif et verifie ROUGE : (1) l'explication « un seul bit » ci-dessus ; (2) groupes_alphabet SOUS-COMPTAIT, il ne montait qu'a la sortie sur CR — un groupe abime dont le CR est perdu finit sur le LF suivant, sur l'ETX ou sur un ETX corrompu, il etait alors compte rejete mais PLUS impute a sa cause, et les colonnes prevues par #5 en auraient herite ; les QUATRE sorties imputent desormais ; (3) LE PIRE, parce qu'il faisait accuser le COMPTEUR : le test vivait dans elif in_line, donc un octet hors alphabet arrivant HORS d'un groupe ne tombait dans AUCUNE branche et disparaissait avec tout le groupe suivant. Deux bits du LF suffisent — 0x0A devient 0x09, soit HT, parite preservee et illegal en historique — apres quoi _cause_rejets concluait « cette etiquette n'est pas emise ? », exactement l'accusation a tort que ce chantier existe pour supprimer. Le chemin de la PARITE traitait deja ce cas et pour la raison exacte ; l'alphabet ouvre desormais le groupe lui-meme, condamne d'avance, pour qu'il soit COMPTE. Et la frontiere tient dans les deux sens : le meme octet AVANT le STX ne coute rien, donc le cas du triphase reste intact. COUT MESURE SUR PI ZERO W (armv6l, nice -19) : appel de fonction not f(b) 10,73 us/octet soit 1,030 % de CPU a 9600 bauds ; TABLE not T[b] 2,97 us soit 0,285 % ; temoin d'un appel a vide 3,02 us ; parite existante 11,56 us. Un appel de fonction Python coute A LUI SEUL 3 us sur cette machine, soit la quasi-totalite du cout du predicat — d'ou une TABLE de 128 entrees, x3,6 moins chere et au prix d'une instruction vide : 0,036 % de CPU a 1200 bauds, ce que l'issue exigeait (ne doit RIEN couter sur une ligne saine). Meme forme et meme raison que la table PARITE. 128 entrees et pas 256, deliberement : read_frame indexe avec l'octet DEJA MASQUE, apres que la parite a juge le huitieme bit ; une table de 256 laisserait croire qu'on peut se passer du masque. Les tables sont DERIVEES des predicats, jamais reecrites — une table et un predicat qui divergent, c'est un controle qui dit deux choses selon l'appelant — et le banc le verifie sur les 128 valeurs, comme pour PARITE. LE RELEVE GAGNE SA TROISIEME CAUSE : alphabet (octets) et groupes_alphabet (groupes), et _cause_rejets la NOMME, les deux quand les deux ont mordu. Fondre les causes dirait « ca decroche » sans dire OU : un octet hors parite accuse le BRUIT du fil, un octet hors alphabet une corruption que la parite ne POUVAIT PAS voir, un checksum faux sur un groupe integralement lu autre chose encore. Pas de pendant tout/groupes comme pour la parite : un octet hors groupe n'est pas accumule, donc tous ceux comptes ici ont coute un groupe. Pour #5 : les colonnes seraient groupes_ko_alphabet a cote de groupes_ko_parite et groupes_ko_checksum. LE CODE VIT DANS tic_parite.py, PAS DANS UN FICHIER NEUF, et c'est une decision : un fichier neuf doit etre copie par l'update.sh qui le livre, et s'il est oublie le lecteur meurt sur ImportError — en boucle, puisque systemd le relance. C'est le mode de defaillance qui a brule pi-0.9.0 (paho oublie). Ajouter a un fichier DEJA DEPLOYE depuis 0.9.18 n'a pas ce risque. LA TABLE S'INJECTE PAR MODES, comme checksum_ok et parse_label : read_frame reste MODE-AGNOSTIQUE. Et le defaut du parametre vaut l'HISTORIQUE, donc le plus STRICT — oublier d'injecter la table standard rend le lecteur MUET (tous les groupes condamnes sur leurs HT), panne bruyante que le banc attrape, la ou le defaut inverse rouvrirait le trou EN SILENCE puisque I et HT sont a exactement 64 l'un de l'autre. CE SCRIPT NE TOUCHE QUE ben-tic-reader, et seulement si le boitier declare tic-uart : la chaine LoRa ne passe pas par read_frame, donc ni ben-telemetry ni ben-radio ne sont concernees — et ben-radio moins que tout, seule maitresse du RFM95 et du SPI, dont le verrou taint de 0.9.12 est ne d'un redemarrage de trop. Il ne DEMARRE pas ce qui ne tournait pas (lecon de 0.9.17). Preflight : ast.parse (JAMAIS py_compile, __pycache__ root), le correctif BRANCHE verifie dans la source (un controle livre mais jamais appele serait une update qui ne change rien, en silence), et les tables EPROUVEES SUR LA CIBLE AVEC LEUR TEMOIN — sans le temoin, une table qui refuserait TOUT passerait tous les cas de refus et le boitier cesserait d'enregistrer, service active et journaux calmes. Controle d'effet sur /health (db=true ET last_tic_ts qui avance), JAMAIS /info, et la lecture n'est EXIGEE que si le boitier lisait avant — sinon un cable TIC debranche ferait echouer l'update et la ferait rejouer toutes les 10 min pour toujours. EPROUVE : 29/29 sur read_frame, 9/9 sur les controles d'octet, 14 bancs du depot verts ; temoin tenu sur ben-0003 (filaire, pi-0.9.25) — code pose a la main, lecteur redemarre, last_tic_ts avance, puis depot RETABLI pour ne pas bloquer son OTA (l'agent fait un checkout NU). AUCUNE migration, aucune table, aucune colonne.
