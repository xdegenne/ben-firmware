    script: "updates/0.9.15_to_0.9.16/update.sh"   # LE BOÎTIER ENTRETIENT SON PROPRE CERTIFICAT. POURQUOI : mesuré le 23/09 sur iPhone 11 / iOS 26.5, trois certificats portant LA MÊME CLÉ PRIVÉE, seul le certificat changeant — CN seul 10 ans : Android OK, iOS REFUSE ; CN+SAN 10 ans : Android OK, iOS REFUSE ; CN+SAN 397 jours : iOS ACCEPTE. Une seule variable, la DURÉE : Apple plafonne les certificats SERVEUR à ~398 jours MÊME avec une CA privée fournie par l'application. Les certificats du parc font 3650 jours — inutilisables pour le futur HTTPS local, et il faut pouvoir les remplacer à répétition, tous les six mois, sans se déplacer. LIVRE : (1) `src/pi/certd/ben_certd.py`, l'agent — réveil quotidien à GIGUE PLEINE (`random.uniform(période/2, période)`, pas un intervalle fixe, sinon toute la flotte se réveille ensemble après une coupure générale), GET :8444/ pour obtenir une directive, et RIEN en mémoire : l'état vit côté serveur, sinon les deux pourraient diverger et ce serait toujours le boîtier qui aurait tort sans moyen de le savoir. (2) `ben-certd.service`, sans [Install]/WantedBy — c'est `ben-network-check` qui le lance, dans la MÊME branche que les lecteurs : provisionné ET en ligne. Ni WatchdogSec ni StartLimitAction=reboot — un agent de certificat qui tombe ne doit JAMAIS rebooter le Pi (leçon du verrou taint, 0.9.12). (3) `/etc/sudoers.d/ben-certd` : UN verbe, UNE unité, `systemctl restart ben-publisher`. Nécessaire parce que le publisher charge son certificat UNE SEULE FOIS, à la construction de son contexte SSL, puis tient une connexion persistante — sans redémarrage il continuerait indéfiniment avec l'ancien, SANS LA MOINDRE ERREUR, et ben-api enregistrerait l'ancien certificat : divergence silencieuse dans la table même qui pilote la bascule du parc. (4) `check_network.py` démarre certd à côté du publisher — via le helper `_start()`, jamais un subprocess en dur : les deux lignes qui l'avaient fait (publisher, 0.9.15) échappaient au banc `test_network_recovery.py` et l'ont laissé ROUGE pendant trois versions sans que personne ne le voie. 🚨 LE RISQUE PROPRE À CETTE VERSION EST LE SUDOERS : un fichier malformé dans /etc/sudoers.d casse `sudo` POUR TOUT LE MONDE, sur un boîtier qu'on ne peut pas dépanner à distance. D'où `visudo -cf` sur la SOURCE AVANT toute installation (vérifier après serait vérifier depuis l'intérieur du trou), mode 0440 root:root — sudo refuse EN SILENCE un fichier accessible en écriture à autrui — puis `visudo -c` sur la configuration GLOBALE, celle que sudo relira réellement. GARDES DE L'AGENT, du moins cher au plus cher, et l'ORDRE COMPTE : (a) pas déjà expiré — EN PREMIER, parce que `openssl verify` contrôle les dates DANS la validation de chaîne : placé après, ce contrôle ne serait JAMAIS atteint et un certificat expiré serait journalisé « chaîne invalide » (trouvé par le banc, pas par relecture) ; (b) chaîne valide contre le root-ca.crt DU BOÎTIER ; (c) 🚨 la clé publique correspond à `device.key` — LE garde qui évite la brique définitive, un certificat qui ne correspond pas à la clé locale rend le boîtier MUET et sans mTLS il ne peut même plus signaler qu'il est cassé ; (d) le CN est bien le sien ; (e) ⭐ une poignée de main mTLS COMPLÈTE avec le candidat pendant que l'ancien est encore en place — on ne DÉDUIT plus qu'il marchera, on l'a UTILISÉ. Puis écriture atomique (`os.replace`), ancien conservé à côté. 🚨 CE QUI NE FAIT PAS ÉCHOUER L'UPDATE : un boîtier sans certificat, ou un cloud injoignable. certd a Restart=always, l'ancien certificat reste valide jusqu'à son échéance et il n'y a JAMAIS urgence à renouveler ; faire échouer l'update la ferait REJOUER tous les 10 min pour toujours — la mécanique qui a brûlé pi-0.9.12. PRÉFLIGHT : ast.parse — JAMAIS py_compile, qui écrit dans __pycache__ appartenant à root alors que l'OTA tourne en `ben` — sur ben_certd.py ET sur check_network.py (une erreur de syntaxe dedans ne casse pas cette update, elle casse le PROCHAIN BOOT en silence et laisse un boîtier sans aucun lecteur), plus un grep exigeant que check_network démarre bien ben-certd. CONTRÔLE D'EFFET : sudoers en place et configuration globale valide, unité connue de systemd, agent LISIBLE PAR `ben` (il l'exécute), /health de l'API locale avec db:true, publisher toujours actif. On ne vérifie PAS que certd a joint ben-api ni qu'un certificat a été renouvelé : ça dépend du réseau, du serveur et d'un geste opérateur — pas de nous. AUCUNE migration, aucune table, aucune colonne — certd ne touche pas à la base. UNIVERSEL (LoRa et filaire) : entretenir son certificat n'est pas une propriété du matériel, c'est une fonction de flotte. Côté boîtier documenté dans docs/pki-renouvellement.md (ce dépôt est PUBLIC — la politique serveur n'y figure pas). ✅ SCRIPT EXÉCUTÉ TEL QUEL SUR ben-0003 LE 24/09 À 11:50 — boîtier FILAIRE en 0.9.15, dépôt propre, n'ayant NI l'agent, NI l'unité, NI le sudoers : donc exerçant réellement l'installation fraîche, y compris le geste sudoers. Code de sortie 0, tous contrôles verts. Effet constaté dans la foulée : « CSR déposé (202) — motif : durée 3650 j > 180 j », CSR visible côté opérateur, signé puis armé, et au tour suivant « certificat remplacé », « ben-publisher redémarré », « acquitté auprès de ben-api (204) » — tâche fermée, inventaire serveur passé de 3650 à 180 jours. Le dépôt du boîtier a ensuite été remis propre (`git status` vide) pour que le `git checkout pi-0.9.16` de l'OTA ne bute pas sur des fichiers non suivis.
