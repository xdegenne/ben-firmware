    tag:  "pi-0.9.24"
    script: "updates/0.9.23_to_0.9.24/update.sh"   # L'ÉCHEC SE SIGNALE LUI-MÊME, ET LA SONDE VOIT ENFIN (#21). pi-0.9.23 a été livrée le 2026-10-01 vers 11 h ; deux heures plus tard le boîtier qui motive tout le chantier l'avait prise, avait envoyé son premier instantané, et ne nous avait TOUJOURS RIEN APPRIS. Les deux raisons sont des défauts de 0.9.23, pas du boîtier. 🚨 ① LA SONDE `pub` ÉTAIT AVEUGLE AU SEUL MOMENT OÙ ELLE S'EXÉCUTE : `N_PUB` valait 5, et un redémarrage systemd émet CINQ lignes à lui seul. Remonté mot pour mot à 11:47 : « Stopped ben-publisher.service », « Consumed 1.308s CPU time », « Started ben-publisher.service », « [INFO] démarrage — … lots de 1000 toutes les 60 s », « [INFO] ~569526 point(s) en attente ». Cinq lignes, cinq places, AUCUNE de l'ancien processus — qui est sa raison d'être, puisque la sonde ne tourne QUE au hello qui suit le redémarrage de l'OTA. ⚖️ Le défaut ne produisait aucune erreur : cinq lignes valides, bien formées, vides de sens. Rien dans un banc fonctionnel ne pouvait s'en plaindre — c'est la CONSTANTE qu'il faut lire, et un cas STRUCTUREL le fait désormais, vérifié par mutation (il tombe quand on remet 5). N_PUB = 40 couvre ~40 min d'un publisher en échec pour ~3,5 Ko, contre un plafond serveur de 16 Ko. 🚨 ② L'INSTANTANÉ N'ARRIVAIT QU'UNE FOIS PAR JOUR. Mesuré le même jour sur le même boîtier : il MESURE (dernier point à l'instant, trame LoRa toutes les 38 s), il est EN LIGNE (hello 204 en 17 ms, WiFi -40 dBm), son publisher TOURNE (active/running, 0 redémarrage, charge 0,24), pending = 569 526 soit EXACTEMENT les 8,8 jours manquants à 0,35 % près (débit mesuré par le cloud 64 236 pts/jour × 8,78 jours = 564 263) — et ZÉRO POST de mesures pendant que six autres boîtiers en font 25 en 25 minutes. ⭐ ET CÔTÉ SERVEUR : AUCUN 4xx, sur aucun boîtier. Le serveur ne refuse rien, le boîtier ne DEMANDE pas. ⇒ il échoue localement et l'écrit à chaque tentative, et cette ligne restait illisible jusqu'au lendemain parce que l'instantané ne voyage qu'avec le hello et que le hello ne part qu'une fois par jour (HELLO_EVERY=86400). On attendait 24 h pour apprendre ce que le boîtier savait depuis la première minute. ⭐ DÉSORMAIS, au franchissement de ECHECS_ERREUR, le publisher envoie un hello : l'instantané part PENDANT la panne, avec les lignes de son propre journal. ⚠️ Plafonné à UN PAR HEURE (HELLO_SUR_ECHEC_S=3600) et jamais plus d'un par panne continue — sans ce plancher un boîtier en panne persistante enverrait un instantané toutes les 300 s au plafond du backoff, avec jusqu'à 20 s de collecte à chaque fois : un boîtier coupé du monde doit signaler, pas battre. ⚠️ Le seuil est celui de l'ERREUR, pas le premier échec : une coupure de quelques secondes arrive tous les jours sur les sept boîtiers. UN SEUL SEUIL, partagé avec `niveau_echec()` — deux seuils seraient deux choses à garder d'accord. 🚨 ET L'ORDRE EST LE FOND : le hello part APRÈS la ligne de journal, jamais avant, parce que `snapshot()` LIT le journal ; envoyé d'abord, le signalement partirait avec un instantané qui ne contient pas l'échec qui l'a déclenché — un signalement qui ne signale rien, exactement le défaut de N_PUB = 5. Un cas STRUCTUREL lit donc l'ordre dans la source, les deux ordres produisant un hello valide, un code de retour identique et aucune erreur. ⚠️ ET UN BANC QUI MENTAIT, ATTRAPÉ PAR MUTATION : le cas qui vérifie que le signalement réarme `prochain_hello` ancrait sur `signaler_echec(echecs`, qui matche d'abord la DÉFINITION de la fonction deux cents lignes plus haut ; le bloc extrait englobait tout `main()` et contenait le `prochain_hello = hello()` d'AVANT la boucle, donc le cas passait avec le défaut en place. Corrigé en ancrant sur `if signaler_echec(` après avoir découpé le corps de la boucle. ⭐ C'EST LA MUTATION QUI L'A TROUVÉ, PAS LA RELECTURE : les trois cas structurels de ce tag sont vérifiés en réintroduisant le défaut. ⭐ `signaler_echec()` est extraite en FONCTION PURE, comme `cadence()` et `niveau_echec()` — c'est ce qui permet d'éprouver le plancher horaire sans attendre une heure, sans réseau et sans base ; le préflight l'ÉPROUVE SUR LA CIBLE avec son témoin (une fonction qui rendrait toujours True ferait battre le parc entier). ⚠️ `dernier_hello_echec` part de `-inf` et non de 0.0 : `time.monotonic()` part de l'uptime, donc avec 0.0 le premier signalement serait immédiat sur un boîtier debout depuis longtemps et retardé d'une heure sur un boîtier qui vient de démarrer — deux comportements pour un seul code. CE SCRIPT NE TOUCHE À AUCUN SERVICE : le seul concerné est ben-publisher, que check_update.py redémarre systématiquement à son étape 10. Il rejoue l'ajout de `ben` au groupe systemd-journal (idempotent) — sans ce groupe `errors` ET `pub` restent vides, soit les deux champs sur lesquels repose tout ce chantier. 🚨 ③ ET `pending` ENCADRE, IL NE COMPTE PAS — J'AI CONFONDU LES DEUX : `pending_approx()` vaut max(rowid) - min(rowid WHERE sent=0) + 1, donc il prouve OÙ se trouve la plus vieille ligne non envoyée et RIEN DE PLUS. On a lu « 566 248 en attente » et on en a déduit « un lot plein part à chaque tour, donc il échoue » — alors qu'UNE SEULE ligne restée à sent=0 sur un vieux rowid produit exactement le même chiffre. L'accord à 0,35 % avec le trou de 8,78 jours établit la POSITION de cette ligne (22/09 15:44), pas leur NOMBRE. `health.unsent` compte, borné au lot : SELECT count(*) FROM (SELECT 1 FROM measurements WHERE sent = 0 LIMIT 1000). = 1000 ⇒ un lot plein existe, donc un POST est tenté, donc il échoue, et `pub` dit pourquoi ; = 0 ⇒ il n'a rien à envoyer, donc aucun POST et aucun échec, `pending` est un artefact et la question devient pourquoi des lignes sont `sent=1` alors que le cloud ne les a pas ; entre les deux ⇒ des lots partiels, un troisième cas qu'on ne voyait pas. ⚠️ BORNÉ, et c'est tout ce qui le rend possible : un count(*) nu sur sent=0 balaie les millions d'entrées de l'index et prend 37 s sur un Pi Zero. Mesuré avec la borne RÉELLEMENT atteinte : 1,8 ms (radio) et 2,2 ms (filaire), par index COUVRANT — idx_meas_sent suffit, aucun accès table. La borne est lue sur BEN_PUB_BATCH, la MÊME variable que ben_publisher.BATCH, et non sur une constante à part qui divergerait au premier réglage ; health est importé PAR ben_publisher, l'importer en retour serait circulaire. 🚨 ④ ET « RIEN À ENVOYER » N'ÉCRIVAIT RIEN : la branche était en `log.debug` et le niveau racine est INFO. ⇒ un publisher qui échoue en boucle et un publisher qui n'a rien à envoyer laissaient EXACTEMENT la même trace, aucune — impossible de les séparer à distance, et c'est ce qui a coûté neuf jours. Elle passe en `info` AVEC LE RETARD JOINT, parce que c'est la CONTRADICTION qui informe : « rien à envoyer · reste ~569526 » dit en une ligne que pending et la réalité ne s'accordent pas, là où les deux chiffres séparés ne disaient rien. ⚠️ Gratuit sur un boîtier sain : à 0,74 point/s et une période de 60 s chaque tour porte ~44 points, donc cette branche n'y est jamais atteinte. ⚠️ Et l'appel à pending_approx() y est gardé par un try/except sqlite3.Error : il est DANS le try de la boucle, une erreur locale compterait comme un échec SERVEUR et enverrait le publisher en backoff long — le défaut même que cadence_sure() existe pour éviter. ÉPROUVÉ : bancs 30 (health) et 22 (cadence) cas, verts sur Mac ; SIX mutations vérifiées (N_PUB remis à 5, signalement avant le log, prochain_hello non réarmé, LIMIT retirée, unsent recopiant pending, debug au lieu d'info) et toutes attrapées. AUCUNE migration, aucune table, aucune colonne.
