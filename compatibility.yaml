    script: "updates/0.9.21_to_0.9.22/update.sh"   # LE BOÎTIER JOINT UN INSTANTANÉ DE SANTÉ À SON HELLO (#16). Un boîtier qui CESSE DE MESURER continue de dire bonjour : `last_seen` reste frais côté cloud, l'OTA passe, et RIEN ne le signale. Constaté le 2026-10-01 sur un boîtier du parc — NEUF JOURS sans une seule mesure, découverts par hasard, sur une machine injoignable (ni SSH ni VPN). ⭐ `last_seen` confond TROIS états : mesure et publie / mesure mais ne publie pas / NE MESURE PLUS. Seul le dernier est une panne, et c'est le seul invisible ; cet instantané ne sert qu'à séparer le premier du troisième et à dire POURQUOI. ⭐⭐ CE QUI SÉPARE DEUX PANNES QUI SE RESSEMBLAIENT : pour un boîtier radio muet, « l'émetteur est mort » et « le récepteur est sourd » donnaient la MÊME signature (plus de trames). Deux champs les séparent, et ils existaient déjà sans qu'on les publie — `silence_restarts`, que ben-radio remet à 0 à chaque trame et incrémente quand son détecteur de silence le relance (donc GRAND après des jours si le récepteur écoute vraiment, NUL si le détecteur n'a jamais joué) ; et `radio.recent`, les 20 dernières trames de `lora_link` AVEC LEURS HORODATAGES pour 3,5 ms — sur un boîtier muet depuis des jours elles datent du JOUR DE SA MORT, donc chute brutale à pleine puissance ⇒ alimentation (cf. la diode BAT85 de ben01), dégradation progressive ⇒ antenne ou portée. Aucun autre champ ne permet de trancher ça, et l'information s'effacera à 180 jours. AUTRES CHAMPS QUE PERSONNE NE REGARDAIT : `tainted` (le masque de bits du noyau, BRUT — on stocke le fait, on décode à la lecture. ⚠️ le PLANCHER d'un Raspberry Pi est 1024, bit 10 `C` pour les pilotes staging snd_bcm2835/vc_sm_cma/bcm2835_isp : c'est l'état normal de Raspberry Pi OS, pas un incident, et ce sera 1024 sur les sept boîtiers. ⭐ CE QUI COMPTE EST TOUT BIT AU-DELÀ : 128 = le noyau est mort récemment (OOPS/BUG, vécu sur un boîtier), 16384 = soft lockup soit la signature d'un SPI figé, 512 = WARNING. Donc 1152 = Pi normal PLUS un oops. ⓘ le drapeau est PERMANENT, et c'est ce qui en faisait un mauvais signal de santé en 0.9.12 où il pilotait un test périodique — 208 redémarrages de ben-radio, 46 % des mesures perdues ; on le RAPPORTE, on ne décide rien avec), `wifi` via /proc/net/wireless pour 7,9 ms (ben-0001 est à -76 dBm contre -31 pour ben-0003 : la question des « fenêtres de connectivité » commence peut-être là), `repo.dirty` (un dépôt SALE bloque le `git checkout` NU de l'OTA — piège documenté qu'on ne pouvait constater qu'en SSH), `pdl[].last_ts` PAR compteur, `pending` en O(1), `emitter`, `units[].NRestarts`, et les 8 dernières erreurs de journal SERVICES ET NOYAU (c'est là qu'apparaissent les blocages SPI et les sous-tensions). 🚨 L'INNOCUITÉ PRIME SUR LE CONTENU : cet instantané voyage dans le hello, qui porte les compteurs, les époques tarifaires et les libellés des sept boîtiers — une sonde qui lève ferait échouer le hello ENTIER et perdrait des métadonnées pour un champ de diagnostic. Chaque sonde est donc isolée et se replie sur l'ABSENCE de son champ, JAMAIS sur une valeur de repli : « 0 trame reçue » et « je n'ai pas pu compter » ne veulent pas dire la même chose. Délai PAR SONDE (4 s) ET budget global (12 s), parce que le vrai risque n'est pas qu'une sonde lève mais qu'elle PENDE. ÉCARTÉ APRÈS MESURE SUR LA CIBLE, et ce n'est pas de la prudence théorique : `PRAGMA quick_check` n'est pas « coûteux », il est NUISIBLE — sur une base de 490 Mo il a poussé la charge d'un Pi Zero mono-cœur de 1,15 à 4,50, rendu `sshd` incapable de répondre pendant plus d'une minute et ne s'est pas terminé en 180 s ; `journalctl --since` coûtait 9 SECONDES pour rendre 0 octet là où `-n 8` seul en rendait 8 392 (les dernières erreurs existaient, elles dataient de plus de 24 h — filtrer par date côté boîtier coûtait neuf secondes POUR JETER L'INFORMATION UTILE, on rend donc les dernières avec leur horodatage et c'est le lecteur qui juge) ; `systemctl status` pagine et rend de la prose localisée, d'où `systemctl show --property=` et `--timestamp=unix` obligatoire ; `vcgencmd get_throttled` échoue en utilisateur `ben`. ⭐ `collect_ms` et `load` sont DANS le paquet : un instantané pris en 1 s sur un boîtier au repos et un pris en 30 s sur un boîtier en détresse se ressemblent et ne disent pas la même chose. 🚨 CE SCRIPT NE TOUCHE À AUCUN SERVICE, et c'est voulu : le seul service concerné est ben-publisher, que `check_update.py` redémarre SYSTÉMATIQUEMENT après chaque update (étape 10) — le redémarrer ici serait deux coupures pour le même effet. C'est la leçon de 0.9.17 poussée à son terme. Le préflight EST le contrôle : il ne vérifie pas seulement que le code compile, IL EXÉCUTE LA COLLECTE SUR LA CIBLE, sur sa vraie base en lecture seule, et exige un objet SÉRIALISABLE EN JSON (une valeur non sérialisable ferait lever json.dumps DANS le publisher, donc échouer le hello tous les jours), non vide (témoin : un instantané ne contenant que `collect_ms` passerait tout le reste), sous 16 Kio (la borne du serveur) et sous 10 s. ⚠️ Le contrôle FINAL est CÔTÉ SERVEUR : `device_health` doit gagner une ligne au prochain hello — le hello part après ce script, on ne peut pas l'observer d'ici. PRÉREQUIS : la table `device_health` et l'API qui l'accepte sont DÉJÀ DÉPLOYÉES (ben-api#5, image d30add8) ; l'ordre inverse aurait coupé l'ingestion des sept boîtiers d'un coup. ÉPROUVÉ : banc `test_health.py` à 16 cas, verts sur Mac (où /proc et systemctl n'existent pas — c'est le cas de panne, gratuit), sur un boîtier RADIO et sur un boîtier FILAIRE. Deux défauts trouvés en lançant la collecte sur de vrais boîtiers et qu'aucun banc sur Mac n'aurait vus : `capabilities` est un DICT dans device.json et pas une liste (ne garder que les listes faisait disparaître le champ EN SILENCE, alors qu'il porte la version de firmware de l'émetteur), et le cas « boîtier filaire » était vert PAR ACCIDENT sur Mac faute de /var/lib alors qu'il échouait sur un vrai boîtier radio — `radio()` lit aux DEUX endroits, la table ET les fichiers d'état. Coût mesuré : 4 786 ms et 576 o gzippés en radio, 988 ms en filaire, pour un hello qui fait déjà 276 o gzippés et des mesures à 270 Mo/an. AUCUNE migration, aucune table, aucune colonne côté boîtier.
